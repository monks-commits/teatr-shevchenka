<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Журнал продаж</title>
  <style>
    .sales-page { font-family: Arial, sans-serif; padding: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f3f3f3; }
    tr:hover { background: #fafafa; }
    .right { text-align: right; }
  </style>
</head>
<body>
  <div class="sales-page">
    <h1>Журнал продаж</h1>

    <table>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Сеанс</th>
          <th>Місця</th>
          <th class="right">Сума</th>
          <th>Тип</th>
          <th>Коментар</th>
        </tr>
      </thead>
      <tbody id="sales-body"></tbody>
    </table>
  </div>

  <script src="./sales-log.js"></script>
</body>
</html>

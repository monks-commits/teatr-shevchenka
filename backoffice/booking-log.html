<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Журнал бронювання</title>
  <style>
    .booking-page {
      font-family: Arial, sans-serif;
      padding: 16px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      vertical-align: top;
    }
    th {
      background: #f3f3f3;
      text-align: left;
    }
    tr:hover {
      background: #fafafa;
    }
    .right {
      text-align: right;
    }
    .muted {
      color: #777;
    }
  </style>
</head>
<body>
  <div class="booking-page">
    <h1>Журнал бронювання</h1>

    <table>
      <thead>
        <tr>
          <th>Дата</th>
          <th>Сеанс</th>
          <th>Місця</th>
          <th>К-сть</th>
          <th>Клієнт / примітка</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="booking-body"></tbody>
    </table>
  </div>

  <script src="./booking-log.js"></script>
</body>
</html>

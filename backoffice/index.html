<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Білетний відділ</title>
  <link rel="stylesheet" href="../styles.css" />

  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }

    .container{
      max-width:1480px;
      margin:0 auto;
      padding:12px;
      height:calc(100vh - 24px);
    }

    .bo-top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:10px}
    .bo-title{font-size:20px;font-weight:800;margin:0}
    .bo-tabs{display:flex;gap:10px}
    .tabbtn{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
    .tabbtn.active{background:#111827;color:#fff;border-color:#111827}

    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px}
    .row{display:flex;gap:10px;align-items:center}
    .field{display:grid;gap:6px}
    .field label{font-size:12px;color:#6b7280}
    .field input,.field select{
      border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;
    }

    .btn2{border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;border:0}
    .btn2.primary{background:#2563eb;color:#fff}
    .btn2.gray{background:#e5e7eb}

    .hallWrap{
      background:#f3f4f6;border-radius:16px;border:1px solid #e5e7eb;
      height:calc(100vh - 260px);overflow:hidden;
    }
    #cashFrame{width:100%;height:100%;border:0;display:none}
    #cashHint{display:flex;align-items:center;justify-content:center;height:100%;color:#6b7280;font-weight:700}
  </style>
</head>

<body>
<main class="main">
<div class="container">

  <div class="bo-top">
    <h1 class="bo-title" id="boTitle">Білетний відділ</h1>
    <div class="bo-tabs" id="tabs">
      <button class="tabbtn active" data-tab="events">Події</button>
      <button class="tabbtn" data-tab="create">Створення</button>
      <button class="tabbtn" data-tab="clients">Клієнти</button>
      <button class="tabbtn" data-tab="orders">Замовлення</button>
    </div>
  </div>

  <!-- EVENTS -->
  <section class="panel" data-pane="events">
    <div class="row">
      <div class="field">
        <label>Подія / сеанс</label>
        <select id="showSelect"></select>
      </div>
      <div class="field">
        <label>Пошук місця</label>
        <input id="seatSearch" placeholder="P2-M10"/>
      </div>
    </div>

    <div id="seanceMeta" style="margin-top:8px;color:#6b7280">Оберіть сеанс.</div>

    <div class="hallWrap" id="hallWrap" style="margin-top:10px">
      <div id="cashHint">Оберіть сеанс, щоб відкрити схему каси</div>
      <iframe id="cashFrame"></iframe>
    </div>
  </section>

  <!-- CREATE -->
  <section class="panel" data-pane="create" hidden>

    <h2 style="margin-bottom:10px">Новий сеанс</h2>

    <div class="row" style="margin-bottom:12px">
      <div class="field">
        <label>Шаблон / подія з афіші</label>

        <!-- ❗ КЛЮЧЕВОЙ ЭЛЕМЕНТ -->
        <select id="createShowSelect">
          <option value="">— обрати —</option>
        </select>

      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>Назва події</label>
        <input id="c_title" placeholder="Мауглі"/>
      </div>
      <div class="field">
        <label>Дата</label>
        <input id="c_date" type="date"/>
      </div>
      <div class="field">
        <label>Час</label>
        <input id="c_time" type="time"/>
      </div>
      <div class="field">
        <label>Зал</label>
        <select id="c_hall">
          <option value="main">Основний</option>
        </select>
      </div>
    </div>

    <div class="hallWrap" style="margin-top:12px">
      <iframe
  id="createHallFrame"
  src="about:blank"
  style="width:100%;height:100%;border:0">
</iframe>

    </div>

    <button class="btn2 primary" style="margin-top:12px;width:100%">
      💾 Зберегти сеанс
    </button>

  </section>

</div>
</main>

<script src="./utils.js"></script>
<script src="./ui.js"></script>
<script src="./app.js"></script>
</body>
</html>

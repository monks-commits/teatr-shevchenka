<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Активні бронювання</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f6f7f9; margin:0; padding:16px; }
    h1 { margin-bottom:12px; }
    table { width:100%; border-collapse:collapse; background:#fff; }
    th, td { padding:8px 10px; border-bottom:1px solid #e5e7eb; font-size:14px; }
    th { background:#f0f2f5; font-weight:600; }
    tr:hover { background:#fafafa; }
    .soon { color:#b45309; font-weight:600; }
    .expired { color:#b91c1c; font-weight:600; }
  </style>
</head>
<body>

<h1>Активні бронювання</h1>

<table id="bookings-table">
  <thead>
    <tr>
      <th>Створено</th>
      <th>Сеанс</th>
      <th>Місця</th>
      <th>До</th>
      <th>Статус</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./bookings.js"></script>
</body>
</html>

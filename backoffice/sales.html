<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Продажі</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f9;
      margin: 0;
      padding: 16px;
    }
    h1 { margin-bottom: 12px; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      text-align: left;
    }
    th {
      background: #f0f2f5;
      font-weight: 600;
    }
    tr:hover { background: #fafafa; }

    .money { font-weight: 600; }
    .zero { color: #2563eb; } /* запрошення */
  </style>
</head>
<body>

<h1>Продажі</h1>

<table id="sales-table">
  <thead>
    <tr>
      <th>Дата</th>
      <th>Сеанс</th>
      <th>Квитків</th>
      <th>Сума</th>
      <th>Тип</th>
      <th>Статус</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<hr style="margin:16px 0">

<h2>Деталі продажу</h2>
<div id="sale-details" style="background:#fff;padding:12px;">
  <em>Оберіть продаж у таблиці вище</em>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./sales.js"></script>

</body>
</html>

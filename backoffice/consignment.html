<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Реалізація</title>
  <style>
    body { font-family: system-ui; background:#f6f7f9; padding:16px; }
    h1 { margin-bottom:12px; }
    .box { background:#fff; padding:16px; max-width:520px; }
    label { display:block; margin-top:10px; }
    input, textarea { width:100%; padding:6px; }
    button { margin-top:12px; padding:8px 12px; }
  </style>
</head>
<body>

<h1>Під реалізацію (агентам)</h1>

<div class="box">
  <label>Агент</label>
  <input id="con-agent" placeholder="Назва агента">

  <label>Сеанс</label>
  <input id="con-seance" placeholder="visim">

  <label>Місця</label>
  <input id="con-seats" placeholder="P1-M1, P1-M2">

  <label>Коментар</label>
  <textarea id="con-comment"></textarea>

  <button id="con-btn">Передати агенту</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./consignment.js"></script>
</body>
</html>

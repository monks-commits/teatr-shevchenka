<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Під реалізацію</title>
  <style>
    body { font-family: system-ui; background:#f6f7f9; padding:16px; }
    h1 { margin-bottom:12px; }
    .box { background:#fff; padding:16px; max-width:600px; }
    label { display:block; margin-top:10px; }
    input, textarea { width:100%; padding:6px; }
    button { margin-top:12px; }
  </style>
</head>
<body>

<h1>Під реалізацію</h1>

<div class="box">
  <label>Агент</label>
  <input placeholder="Назва агента">

  <label>Сеанс</label>
  <input placeholder="Сеанс">

  <label>Місця</label>
  <input placeholder="P1-1, P1-2, P1-3">

  <button>Передати агенту</button>
</div>

</body>
</html>

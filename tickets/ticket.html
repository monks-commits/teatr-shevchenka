<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Квиток</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @page { size: 80mm 200mm; margin: 5mm; }

    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      padding:16px;
    }

    .ticket{
      width:260px;
      background:#fff;
      border-radius:12px;
      box-shadow:0 6px 20px rgba(15,23,42,0.15);
      padding:14px 16px 12px;
    }

    .ticket-header{
      display:flex;
      justify-content:space-between;
      font-size:11px;
      margin-bottom:6px;
    }

    .ticket-title{
      font-size:13px;
      font-weight:700;
      margin-bottom:6px;
    }

    .row{ font-size:11px; margin:4px 0; }

    .qr-wrap{
      margin:10px auto;
      width:120px;
      height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #e5e7eb;
      border-radius:10px;
    }

    .qr-wrap img{
      width:110px;
      height:110px;
    }

    .muted{
      font-size:10px;
      color:#6b7280;
      text-align:center;
      margin-top:6px;
    }

    @media print{
      body{background:#fff;padding:0;}
      .ticket{box-shadow:none;border-radius:0;}
    }
  </style>

  <!-- ВАЖНО: браузерная версия QRCode -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>

<body>
  <div class="ticket">
    <div class="ticket-header">
      <div>Театр ім. Т. Г. Шевченка</div>
      <div id="order">—</div>
    </div>

    <div class="ticket-title" id="title">Квиток</div>

    <div class="row">Канал: <b>Каса</b></div>
    <div class="row" id="seat">—</div>
    <div class="row" id="price">—</div>

    <div class="qr-wrap" id="qrBox">
      <span class="muted">QR…</span>
    </div>

    <div class="muted">
      Покажіть цей квиток контролеру на вході
    </div>
  </div>

<script>
  function qp(){
    const o = {};
    location.search.slice(1).split("&").forEach(p=>{
      const [k,v] = p.split("=");
      if(k) o[decodeURIComponent(k)] = decodeURIComponent(v||"");
    });
    return o;
  }

  function qrToDataUrl(text){
    return new Promise((resolve, reject)=>{
      if(!window.QRCode || typeof QRCode.toDataURL !== "function"){
        reject("QRCode lib missing");
        return;
      }
      QRCode.toDataURL(
        text,
        { width:110, margin:1, errorCorrectionLevel:"M" },
        (err, url)=>{
          if(err) reject(err);
          else resolve(url);
        }
      );
    });
  }

  (async ()=>{
    const p = qp();

    const order = p.order || ("CASH-" + Date.now());
    const seat  = p.seat  || "";
    const price = p.price || "";

    document.getElementById("order").textContent = order;
    if(seat)  document.getElementById("seat").textContent  = "Місце: " + seat;
    if(price) document.getElementById("price").textContent = "Ціна: " + price + " грн";

    const payload = p.payload || `order:${order}|seat:${seat}`;

    const box = document.getElementById("qrBox");
    box.innerHTML = "";

    function renderCodes(payload){
  const qrBox = document.getElementById("qr");
  qrBox.innerHTML = "";

  if (window.QRCode && qrBox) {
    new QRCode(qrBox, {
      text: payload,
      width: 110,
      height: 110,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qrBox.textContent = "QR недоступний";
  }
}
}

    if(p.autoPrint === "1"){
      setTimeout(()=>window.print(), 400);
    }
  })();
</script>

</body>
</html>

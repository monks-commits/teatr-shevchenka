<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Квиток</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
@page { size: 80mm 200mm; margin: 5mm; }
body{margin:0;font-family:system-ui;background:#f3f4f6;display:flex;justify-content:center;padding:12px}
.ticket{width:260px;background:#fff;border-radius:10px;padding:14px}
.h{display:flex;justify-content:space-between;font-size:11px}
.t{font-weight:700;margin:6px 0}
.m{font-size:11px;margin-top:6px}
.qr{margin-top:10px;display:flex;justify-content:center}
.qr canvas{width:110px;height:110px}
.f{font-size:9px;margin-top:8px;color:#555}
@media print{body{background:#fff}.ticket{box-shadow:none}}
</style>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
</head>

<body>
<div class="ticket">
  <div class="h">
    <div id="theatre">Театр ім. Т. Г. Шевченка</div>
    <div id="order">—</div>
  </div>

  <div class="t" id="title">Назва вистави</div>
  <div class="m" id="dt">—</div>
  <div class="m"><b id="seat">—</b></div>
  <div class="m">Ціна: <span id="price">—</span></div>
  <div class="m">Канал: <span id="channel">Каса</span></div>

  <div class="qr" id="qr"></div>

  <div class="f">
    Покажіть цей квиток контролеру на вході
  </div>
</div>

<script>
function qp(){
  const o={};
  location.search.slice(1).split("&").forEach(p=>{
    const [k,v]=p.split("="); if(k) o[k]=decodeURIComponent(v||"");
  });
  return o;
}

(async function(){
  const p = qp();

  const order_id   = p.order_id || p.order || ("CASH-" + Date.now());
  const show_slug  = p.show || "";
  const seat_label = p.seat || "";
  const price      = p.price || "";
  const title      = p.title || "";
  const date       = p.date || "";
  const time       = p.time || "";
  const channel    = p.channel || "Каса";

  document.getElementById("order").textContent = order_id;
  document.getElementById("title").textContent = title;
  document.getElementById("dt").textContent = [date,time].filter(Boolean).join(" ");
  document.getElementById("seat").textContent = seat_label;
  document.getElementById("price").textContent = price;
  document.getElementById("channel").textContent = channel;

  // 🔴 ЕДИНЫЙ PAYLOAD (он же онлайн)
  const payload = `order:${order_id}|show:${show_slug}|seat:${seat_label}`;

  try {
  const dataUrl = await QRCode.toDataURL(payload, {
    width: 110,
    margin: 1,
    errorCorrectionLevel: "M"
  });

  const img = document.createElement("img");
  img.src = dataUrl;
  img.style.width = "110px";
  img.style.height = "110px";

  document.getElementById("qr").appendChild(img);

} catch (e) {
  console.error("QR error:", e);
  document.getElementById("qr").textContent = "QR недоступний";
}

  if(p.autoPrint==="1"){
    setTimeout(()=>window.print(),400);
  }
})();
</script>
</body>
</html>

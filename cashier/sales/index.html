<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Каса — Продаж квитків (офлайн)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .layout {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    .cash-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: #020617;
      color: #fff;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cash-top label {
      font-size: 14px;
      opacity: .85;
    }
    .cash-top select {
      padding: 6px 10px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      min-width: 320px;
    }
    .hall-wrap {
      position: absolute;
      inset: 0;
      padding-top: 52px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #f8fafc;
    }
  </style>
</head>

<body>

<div class="layout">

  <div class="cash-top">
    <label>Сеанс:</label>
    <select id="seanceSelect">
      <option value="">Завантаження…</option>
    </select>
  </div>

  <div class="hall-wrap">
    <iframe id="hallFrame"></iframe>
  </div>

</div>

<script>
const seanceSelect = document.getElementById("seanceSelect");
const hallFrame = document.getElementById("hallFrame");

// список сеансов (временно вручную)
const SEANCES = [
  "koncert-2026-02-17-18-00",
  "koncert-2026-03-01-18-00",
  "koncert-2026-02-16-18-00"
];

// читаем параметр из URL
const params = new URLSearchParams(window.location.search);
const urlSeance = params.get("seance");

function loadSeances() {
  seanceSelect.innerHTML = `<option value="">Оберіть сеанс…</option>`;

  SEANCES.forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = id;
    seanceSelect.appendChild(opt);
  });

  if (urlSeance) {
    seanceSelect.value = urlSeance;
    loadHall(urlSeance);
  }
}

function loadHall(seanceId) {
  hallFrame.src =
    "../../hall/hall-cash.html?mode=cash&seance=" +
    encodeURIComponent(seanceId);
}

seanceSelect.addEventListener("change", () => {
  const seanceId = seanceSelect.value;
  if (!seanceId) return;
  loadHall(seanceId);
});

loadSeances();
</script>

</body>
</html>

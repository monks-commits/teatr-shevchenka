<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Продаж у касі</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;max-width:920px;margin:20px auto;}
    .muted{color:#6b7280;font-size:14px;}
    input{padding:10px 12px;border-radius:12px;border:1px solid #e5e7eb;width:100%;}
    .grid{display:grid;gap:12px;grid-template-columns:1fr 1fr;}
    @media (max-width:800px){.grid{grid-template-columns:1fr;}}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;font-weight:700;}
    .btn-primary{background:#2563eb;color:#fff;}
    .btn-secondary{background:#e5e7eb;color:#111827;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Продаж у касі</h1>
    <div class="muted" id="meta"></div>

    <div style="height:12px"></div>

    <div class="grid">
      <div>
        <div class="muted">Ім’я (опціонально)</div>
        <input id="buyer_name" placeholder="Покупець"/>
      </div>
      <div>
        <div class="muted">Email (опціонально)</div>
        <input id="buyer_email" placeholder="email@example.com"/>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="grid">
      <button id="btn-sell" class="btn btn-primary" type="button">Продати в касі (друк)</button>
      <a class="btn btn-secondary" id="btn-back" href="../cashier/afisha.html">Назад до афіші</a>
    </div>

    <div style="height:12px"></div>
    <pre id="log" class="muted" style="white-space:pre-wrap;"></pre>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2.48.0";

    const params = new URLSearchParams(location.search);
    const show = params.get("show") || "";
    const seats = params.get("seats") || "";
    const amount = Number(params.get("amount") || "0");
    const title = params.get("title") || "";
    const role = params.get("role") || "";

    const meta = document.getElementById("meta");
    const logEl = document.getElementById("log");
    meta.textContent = `Спектакль: ${title || show} • Місця: ${seats || "(немає)"} • Сума: ${amount} грн`;

    function log(msg){ logEl.textContent += msg + "\n"; }

    // берём настройки проекта
    const settingsRes = await fetch("../data/settings.json", { cache: "no-store" });
    const settings = await settingsRes.json();

    // anon key лучше хранить в отдельном public конфиге, но у тебя уже так сделано в проекте — используй то же, что на сайте.
    // Если anon key уже зашит в checkout.html — скопируй сюда точно так же.
    const SUPABASE_URL = settings.supabase_url;
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || ""; // <-- вставь сюда ключ как на сайте, если он не в window

    if (!SUPABASE_ANON_KEY) {
      log("❌ Немає SUPABASE_ANON_KEY. Встав сюди ключ як у checkout.html.");
    }

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById("btn-sell").addEventListener("click", async () => {
      try {
        if (!show) return alert("Немає show");
        if (!seats) return alert("Немає місць");

        const buyer_name = document.getElementById("buyer_name").value.trim();
        const buyer_email = document.getElementById("buyer_email").value.trim();

        log("→ Викликаю касову продаж...");

        // ВАЖНО: делаем продажу через Edge Function (service role внутри),
        // чтобы она создала order + tickets + pdf_url.
        const { data, error } = await supabase.functions.invoke("cash-sale", {
          body: { show_slug: show, seats, amount, buyer_name, buyer_email }
        });

        if (error) throw error;
        log("✅ OK: " + JSON.stringify(data, null, 2));

        // печать
        if (data?.pdf_urls?.length) {
          for (const url of data.pdf_urls) {
            window.open(url, "_blank");
          }
          alert("Відкрив PDF. Надрукуй квитки у нових вкладках.");
        } else {
          alert("Продаж створено, але PDF не повернулися. Дивись лог.");
        }
      } catch (e) {
        console.error(e);
        log("❌ ERROR: " + (e?.message || String(e)));
        alert("Помилка касової продажі. Дивись лог.");
      }
    });
  </script>
</body>
</html>

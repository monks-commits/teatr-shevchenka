<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Панель касира</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">

<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui}
#app{display:flex;height:100vh}
#left{width:300px;border-right:1px solid #e5e7eb;padding:12px;overflow:auto}
#right{flex:1;padding:12px;overflow:auto}

.seance{padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;cursor:pointer}
.seance.active{background:#dbeafe}

.row{display:flex;gap:4px;margin-bottom:4px}
.lbl{width:28px;text-align:right;font-size:12px;color:#6b7280}
.seat{width:26px;height:26px;border-radius:6px;border:1px solid #d1d5db;font-size:11px;cursor:pointer}
.seat.sel{outline:3px solid #2563eb}
.seat--nosale{background:#e5e7eb;color:#9ca3af;cursor:not-allowed}

#panel{margin-top:12px;border-top:1px solid #e5e7eb;padding-top:12px}
button{padding:10px 14px;border-radius:10px;border:0;font-weight:700;cursor:pointer}
.sell{background:#bbf7d0}
.clear{background:#e5e7eb}
</style>
</head>

<body>
<div id="app">

<div id="left">
<h3>Сеанси (data/seances)</h3>
<div id="list">Завантаження…</div>
</div>

<div id="right">
<h2 id="title">Схема залу</h2>
<div id="hall"></div>

<div id="panel">
<div id="summary">Місця: — | Сума: 0 грн</div>
<button class="sell" id="sell" disabled>ПРОДАТИ</button>
<button class="clear" id="clear">ОЧИСТИТИ</button>
</div>
</div>

</div>

<script>
let SEANCE=null;
let SELECTED=new Map();

function seatKey(r,s){return`P${r}-M${s}`}

function render(){
  const hall=document.getElementById("hall");
  hall.innerHTML="";
  SELECTED.clear();
  update();

  for(let r=1;r<=18;r++){
    const row=document.createElement("div");row.className="row";
    const lbl=document.createElement("div");lbl.className="lbl";lbl.textContent=r;
    row.appendChild(lbl);

    for(let s=1;s<=20;s++){
      const k=seatKey(r,s);
      const cfg=SEANCE.seat_overrides?.[k]||{};
      const rule=Object.entries(SEANCE.pricing||{}).find(([x])=>{
        const m=x.match(/^P(\d+)-(\d+)$/);return m&&r>=+m[1]&&r<=+m[2];
      });

      let price=rule?.[1]?.price||0;
      let cls=rule?.[1]?.class||"";
      if(cfg.sale===false)cls="seat--nosale";

      const b=document.createElement("button");
      b.className=`seat ${cls}`;
      b.textContent=s;
      b.onclick=()=>{
        if(cls==="seat--nosale")return;
        b.classList.toggle("sel");
        SELECTED.has(k)?SELECTED.delete(k):SELECTED.set(k,price);
        update();
      };
      row.appendChild(b);
    }
    hall.appendChild(row);
  }
}

function update(){
  const sum=[...SELECTED.values()].reduce((a,b)=>a+b,0);
  document.getElementById("summary").textContent=
    `Місця: ${SELECTED.size||"—"} | Сума: ${sum} грн`;
  document.getElementById("sell").disabled=!SELECTED.size;
}

async function openSeance(id){
  const r=await fetch(`../data/seances/${id}.json`,{cache:"no-store"});
  SEANCE=await r.json();
  document.getElementById("title").textContent=
    `${SEANCE.meta?.title||id} ${SEANCE.meta?.date||""} ${SEANCE.meta?.time||""}`;
  render();
}

(async()=>{
  const res=await fetch("../data/seances/index.json",{cache:"no-store"});
  const list=await res.json();

  const box=document.getElementById("list");
  box.innerHTML="";
  list.forEach(id=>{
    const d=document.createElement("div");
    d.className="seance";
    d.textContent=id;
    d.onclick=()=>{
      document.querySelectorAll(".seance").forEach(x=>x.classList.remove("active"));
      d.classList.add("active");
      openSeance(id);
    };
    box.appendChild(d);
  });

  if(list[0])box.firstChild.click();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <title>Панель касира</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="../styles.css" />

  <style>
    html,body{height:100%;margin:0}
    body{overflow:hidden;background:#f3f4f6}

    .wrap{
      display:grid;
      grid-template-columns:360px 1fr;
      height:100vh;
      gap:12px;
      padding:12px;
      box-sizing:border-box;
    }

    .left,.right{
      background:#fff;
      border-radius:16px;
      border:1px solid #e5e7eb;
      padding:12px;
      display:flex;
      flex-direction:column;
      min-height:0;
    }

    h1{margin:0 0 8px;font-size:18px}
    .muted{font-size:12px;color:#6b7280}

    .search{
      margin:8px 0;
    }
    .search input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #e5e7eb;
      font-size:14px;
    }

    .list{
      flex:1;
      overflow:auto;
      border:1px solid #e5e7eb;
      border-radius:12px;
    }

    .item{
      padding:10px;
      border-bottom:1px dashed #e5e7eb;
      cursor:pointer;
      font-weight:700;
    }
    .item:last-child{border-bottom:0}
    .item.active{
      background:#111827;
      color:#fff;
    }

    iframe{
      border:0;
      width:100%;
      height:100%;
      border-radius:12px;
    }

    .hint{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:#6b7280;
      font-weight:800;
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- LEFT -->
  <aside class="left">
    <h1>Панель касира</h1>
    <div class="muted">Сеанси з <b>/data/seances</b></div>

    <div class="search">
      <input id="q" placeholder="пошук seance_id">
    </div>

    <div class="list" id="list"></div>
  </aside>

  <!-- RIGHT -->
  <section class="right">
    <div class="muted" id="meta">Оберіть сеанс</div>
    <div style="flex:1;margin-top:8px">
      <div class="hint" id="hint">Сеанс не обрано</div>
      <iframe id="frame" style="display:none"></iframe>
    </div>
  </section>

</div>

<script>
(async () => {
  const LIST = document.getElementById("list");
  const Q = document.getElementById("q");
  const FRAME = document.getElementById("frame");
  const HINT = document.getElementById("hint");
  const META = document.getElementById("meta");

  const REPO = "monks-commits/teatr-shevchenka";
  const PATH = "data/seances";

  let SEANCES = [];
  let ACTIVE = "";

  async function loadSeances(){
    const url = `https://api.github.com/repos/${REPO}/contents/${PATH}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("GitHub API error");

    const files = await res.json();
    SEANCES = files
      .filter(f => f.name.endsWith(".json"))
      .map(f => f.name.replace(".json",""));
  }

  function render(){
    const q = Q.value.toLowerCase();
    const items = SEANCES.filter(id => id.includes(q));

    LIST.innerHTML = items.map(id => `
      <div class="item ${id===ACTIVE?'active':''}" data-id="${id}">
        ${id}
      </div>
    `).join("");

    LIST.querySelectorAll(".item").forEach(el=>{
      el.onclick = ()=>{
        openSeance(el.dataset.id);
      };
    });

    if(!items.length){
      LIST.innerHTML = `<div class="muted" style="padding:12px">Немає сеансів</div>`;
    }
  }

  function openSeance(id){
    ACTIVE = id;
    const url = `../spectacles/hall-cash.html?seance=${id}&embed=1`;
    FRAME.src = url;
    FRAME.style.display = "block";
    HINT.style.display = "none";
    META.innerHTML = `<b>${id}</b>`;
    render();
  }

  Q.oninput = render;

  try{
    await loadSeances();
    render();
  }catch(e){
    LIST.innerHTML = `<div style="padding:12px;color:red">Помилка завантаження seances</div>`;
    console.error(e);
  }
})();
</script>
</body>
</html>

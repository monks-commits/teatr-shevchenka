<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Панель касира</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #f3f4f6;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100vh;
    }

    /* LEFT */
    .left {
      background: #ffffff;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left h2 {
      margin: 16px;
      font-size: 18px;
    }

    .search {
      padding: 0 16px 12px;
    }

    .search input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .seances {
      flex: 1;
      overflow: auto;
      padding: 0 8px 8px;
    }

    .seance {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      margin: 8px;
      cursor: pointer;
    }

    .seance.active {
      background: #111827;
      color: #fff;
    }

    .seance-title {
      font-weight: 800;
      font-size: 14px;
    }

    .seance-meta {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    /* RIGHT */
    .right {
      background: #000;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      font-size: 18px;
      background: #fff;
    }
  </style>
</head>
<body>

<div class="layout">
  <!-- LEFT -->
  <div class="left">
    <h2>Сеанси (data/seances)</h2>

    <div class="search">
      <input id="search" placeholder="пошук..." />
    </div>

    <div class="seances" id="seancesList">
      <div style="padding:16px;color:#9ca3af">Завантаження…</div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="placeholder" id="placeholder">
      Оберіть сеанс зліва
    </div>
    <iframe id="hallFrame"></iframe>
  </div>
</div>

<script>
(async () => {
  const listEl = document.getElementById("seancesList");
  const frame = document.getElementById("hallFrame");
  const placeholder = document.getElementById("placeholder");
  const searchEl = document.getElementById("search");

  let seances = [];
  let activeId = null;

  async function loadSeances() {
    try {
      const res = await fetch("../data/seances/index.json", { cache: "no-store" });
      if (!res.ok) throw new Error("index.json not found");
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("index.json is not array");
      seances = data;
      renderList();
    } catch (e) {
      listEl.innerHTML = `<div style="padding:16px;color:#ef4444">
        Помилка завантаження data/seances/index.json
      </div>`;
      console.error(e);
    }
  }

  function renderList() {
    const q = searchEl.value.toLowerCase().trim();

    const items = seances.filter(s => {
      if (!q) return true;
      return (
        s.seance_id?.toLowerCase().includes(q) ||
        s.meta?.title?.toLowerCase().includes(q)
      );
    });

    if (!items.length) {
      listEl.innerHTML = `<div style="padding:16px;color:#9ca3af">Немає сеансів</div>`;
      return;
    }

    listEl.innerHTML = items.map(s => {
      const active = s.seance_id === activeId ? "active" : "";
      return `
        <div class="seance ${active}" data-id="${s.seance_id}">
          <div class="seance-title">${s.meta?.title || s.seance_id}</div>
          <div class="seance-meta">
            ${s.meta?.date || ""} ${s.meta?.time || ""}
            <br>
            ${s.seance_id}
          </div>
        </div>
      `;
    }).join("");

    listEl.querySelectorAll(".seance").forEach(el => {
      el.addEventListener("click", () => {
        openSeance(el.dataset.id);
      });
    });
  }

  function openSeance(seanceId) {
    activeId = seanceId;
    renderList();

    const url = `../spectacles/hall-cash.html?seance=${encodeURIComponent(seanceId)}&embed=1`;
    frame.src = url;
    placeholder.style.display = "none";
  }

  searchEl.addEventListener("input", renderList);

  await loadSeances();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Каса</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<iframe id="hallFrame"></iframe>

<script>
const params = new URLSearchParams(window.location.search);
const seance = params.get("seance");

const frame = document.getElementById("hallFrame");

if (seance) {
  frame.src = `../hall/hall-cash.html?mode=cash&seance=${encodeURIComponent(seance)}`;
} else {
  frame.src = `../hall/hall-cash.html?mode=cash`;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }

    .c-wrap{
      max-width: 1520px;
      margin: 0 auto;
      padding: 12px;
      height: calc(100vh - 24px);
    }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:10px;
    }
    .title{margin:0;font-size:20px;font-weight:900}
    .muted{color:#6b7280;font-size:12px}

    .grid{
      display:grid;
      grid-template-columns: 420px 1fr;
      gap: 12px;
      height: calc(100vh - 120px);
    }

    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px}
    .left{display:flex;flex-direction:column;min-height:0}
    .right{display:flex;flex-direction:column;min-height:0}

    .field{display:grid;gap:6px;margin-bottom:10px}
    .field label{font-size:12px;color:#6b7280}
    .field input{
      border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;
    }

    .list{
      overflow:auto;
      border:1px solid #e5e7eb;border-radius:12px;
      min-height:0;
    }

    .item{
      padding:10px;
      border-bottom:1px dashed #e5e7eb;
      cursor:pointer;
    }
    .item.active{background:#111827;color:#fff}
    .item:last-child{border-bottom:0}

    .frameWrap{
      background:#f3f4f6;border:1px solid #e5e7eb;border-radius:16px;
      height:100%;overflow:auto;position:relative;
    }

    iframe{
      width:100%;height:100%;border:0;background:#fff;
    }

    #hint{
      position:absolute;inset:0;
      display:flex;align-items:center;justify-content:center;
      color:#6b7280;font-weight:800;
    }
  </style>
</head>

<body>
<main class="main">
<div class="c-wrap">

  <div class="top">
    <div>
      <h1 class="title">Панель касира</h1>
      <div class="muted">Сеанси з <b>data/seances</b>. Єдина схема для онлайн і каси.</div>
    </div>
    <div class="muted" id="status">—</div>
  </div>

  <div class="grid">
    <section class="panel left">
      <div class="field">
        <label>Пошук</label>
        <input id="q" placeholder="частина seance_id" />
      </div>

      <div class="list" id="list">
        <div class="muted" style="padding:12px">Завантаження…</div>
      </div>
    </section>

    <section class="panel right">
      <div class="frameWrap">
        <div id="hint">Оберіть сеанс зліва</div>
        <iframe id="frame"></iframe>
      </div>
    </section>
  </div>

</div>
</main>

<script>
(async () => {
  const LIST = document.getElementById("list");
  const FRAME = document.getElementById("frame");
  const HINT = document.getElementById("hint");
  const Q = document.getElementById("q");
  const STATUS = document.getElementById("status");

  let SEANCES = [];
  let ACTIVE = "";

  async function loadSeances() {
    STATUS.textContent = "Завантаження seances…";

    const api =
      "https://api.github.com/repos/monks-commits/teatr-shevchenka/contents/data/seances";

    const res = await fetch(api);
    const files = await res.json();

    const jsonFiles = files.filter(f => f.name.endsWith(".json"));

    const loaded = [];
    for (const f of jsonFiles) {
      const r = await fetch(f.download_url);
      const j = await r.json();
      if (j.seance_id) loaded.push(j.seance_id);
    }

    SEANCES = loaded.sort();
    STATUS.textContent = `Сеансів: ${SEANCES.length}`;
    render();
  }

  function render() {
    const q = Q.value.trim().toLowerCase();
    const items = SEANCES.filter(s => !q || s.toLowerCase().includes(q));

    if (!items.length) {
      LIST.innerHTML = `<div class="muted" style="padding:12px">Немає сеансів</div>`;
      return;
    }

    LIST.innerHTML = items.map(id => `
      <div class="item ${id===ACTIVE?"active":""}" data-id="${id}">
        <b>${id}</b>
      </div>
    `).join("");

    LIST.querySelectorAll(".item").forEach(el => {
      el.onclick = () => openSeance(el.dataset.id);
    });
  }

  function openSeance(id) {
    ACTIVE = id;
    render();
    FRAME.src = `../spectacles/hall-cash.html?seance=${encodeURIComponent(id)}`;
    FRAME.style.display = "block";
    HINT.style.display = "none";
  }

  Q.oninput = render;

  await loadSeances();
})();
</script>
</body>
</html>

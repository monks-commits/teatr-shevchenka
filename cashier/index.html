<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Панель кассира</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}

.app {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: 100vh;
}

/* ---------- LEFT: seances ---------- */
.sidebar {
  border-right: 1px solid #e5e7eb;
  padding: 12px;
  overflow-y: auto;
  background: #f8fafc;
}

.sidebar h1 {
  font-size: 16px;
  margin: 0 0 10px;
}

.seance {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}

.seance:hover {
  background: #f1f5f9;
}

.seance b {
  display: block;
  font-size: 14px;
}

.seance small {
  color: #6b7280;
  font-size: 12px;
}

/* ---------- RIGHT: hall ---------- */
.main {
  position: relative;
  background: #000;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>

<body>
<div class="app">

  <!-- LEFT -->
  <aside class="sidebar">
    <h1>Сеансы (data/seances)</h1>
    <div id="list">Загрузка…</div>
  </aside>

  <!-- RIGHT -->
  <main class="main">
    <iframe id="hall" src=""></iframe>
  </main>

</div>

<script>
const listEl = document.getElementById("list");
const hall   = document.getElementById("hall");

async function loadSeances() {
  listEl.textContent = "Загрузка…";

  let index;
  try {
    index = await fetch("../data/seances/index.json", { cache: "no-store" })
      .then(r => r.json());
  } catch (e) {
    listEl.textContent = "Ошибка загрузки index.json";
    return;
  }

  listEl.innerHTML = "";

  for (const id of index) {
    let cfg;
    try {
      cfg = await fetch(`../data/seances/${id}.json`, { cache: "no-store" })
        .then(r => r.json());
    } catch {
      continue;
    }

    const div = document.createElement("div");
    div.className = "seance";
    div.innerHTML = `
      <b>${cfg.title || id}</b>
      <small>${cfg.date || ""} ${cfg.time || ""}</small>
      <small>${cfg.seance_id}</small>
    `;

    div.onclick = () => {
      hall.src =
        `../spectacles/hall-cash.html?seance=${cfg.seance_id}&embed=1`;
    };

    listEl.appendChild(div);
  }

  if (!listEl.children.length) {
    listEl.textContent = "Нет сеансов";
  }
}

loadSeances();
</script>
</body>
</html>

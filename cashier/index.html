<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Панель касира</title>
<link rel="stylesheet" href="../styles.css" />

<style>
html,body{height:100%}
body{overflow:hidden}
.c-wrap{max-width:1520px;margin:0 auto;padding:12px;height:calc(100vh - 24px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title{margin:0;font-size:20px;font-weight:900}
.grid{display:grid;grid-template-columns:420px 1fr;gap:12px;height:calc(100vh - 120px)}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px}
.list{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}
.item{padding:10px;border-bottom:1px dashed #e5e7eb;cursor:pointer}
.item.active{background:#111827;color:#fff}
iframe{border:0;width:100%;height:100%}
</style>
</head>

<body>
<div class="c-wrap">
  <div class="top">
    <h1 class="title">Панель касира</h1>
    <div id="status">—</div>
  </div>

  <div class="grid">
    <section class="panel">
      <input id="q" placeholder="пошук…" style="width:100%;margin-bottom:8px">
      <div class="list" id="list"></div>
    </section>

    <section class="panel">
      <div id="meta">Оберіть сеанс</div>
      <iframe id="frame"></iframe>
    </section>
  </div>
</div>

<script>
(async()=>{
  const listEl = document.getElementById("list");
  const frame  = document.getElementById("frame");
  const meta   = document.getElementById("meta");
  const q      = document.getElementById("q");
  const status = document.getElementById("status");

  let SEANCES = [];
  let active = null;

  function open(item){
    active = item.id;
    const url = new URL("../spectacles/hall-cash.html", location.href);
    url.searchParams.set("show", item.id);
    url.searchParams.set("seance", item.seance);
    frame.src = url.toString();
    meta.innerHTML = `<b>${item.title}</b> • ${item.date} ${item.time}`;
    render();
  }

  function render(){
    const s = q.value.toLowerCase();
    listEl.innerHTML = SEANCES
      .filter(x => !s || JSON.stringify(x).toLowerCase().includes(s))
      .map(x=>`
        <div class="item ${x.id===active?'active':''}" data-id="${x.id}">
          <b>${x.title}</b><br>
          ${x.date} ${x.time}<br>
          <small>${x.seance}</small>
        </div>
      `).join("");

    listEl.querySelectorAll(".item").forEach(el=>{
      el.onclick=()=>{
        const it = SEANCES.find(x=>x.id===el.dataset.id);
        open(it);
      }
    });
  }

  try{
    const res = await fetch("../data/seances/index.json",{cache:"no-store"});
    SEANCES = res.ok ? await res.json() : [];
    status.textContent = "Сеансів: " + SEANCES.length;
  }catch(e){
    status.textContent="Помилка завантаження seances";
  }

  q.oninput = render;
  render();
})();
</script>
</body>
</html>

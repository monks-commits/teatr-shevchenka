<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    html, body { height: 100%; }
    body { overflow: hidden; }

    .c-wrap{
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px;
      height: calc(100vh - 24px);
    }

    .top{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:10px;
    }
    .title{margin:0;font-size:20px;font-weight:900}
    .muted{color:#6b7280;font-size:12px}

    .grid{
      display:grid;
      grid-template-columns: 420px 1fr;
      gap: 12px;
      height: calc(100vh - 120px);
      align-items: stretch;
    }

    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px}
    .left{display:flex;flex-direction:column;min-height:0}
    .right{display:flex;flex-direction:column;min-height:0}

    .field{display:grid;gap:6px;margin-bottom:10px}
    .field label{font-size:12px;color:#6b7280}
    .field input,.field select{
      border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;font-size:14px;background:#fff;
    }

    .list{
      overflow:auto;
      border:1px solid #e5e7eb;border-radius:12px;
      min-height:0;
    }
    .item{
      padding:10px 10px;
      border-bottom:1px dashed #e5e7eb;
      cursor:pointer;
      display:grid;
      gap:4px;
    }
    .item:last-child{border-bottom:0}
    .item.active{background:#111827;color:#fff}
    .item.active .muted{color:#cbd5e1}

    .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .btn2{
      display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;
      padding:10px 12px;font-weight:800;cursor:pointer;white-space:nowrap;
    }
    .btn2.primary{background:#2563eb;color:#fff}
    .btn2.gray{background:#e5e7eb;color:#111827}
    .btn2:disabled{opacity:.5;cursor:not-allowed}

    .frameWrap{
      background:#f3f4f6;border:1px solid #e5e7eb;border-radius:16px;
      height: 100%;
      overflow:hidden;
      position:relative;
      min-height:0;
    }
    #cashFrame{
      width:100%;
      height:100%;
      border:0;
      display:none;
      background:#fff;
    }
    #hint{
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#6b7280; font-weight:800;
      padding:16px; text-align:center;
    }

    .hr{height:1px;background:#e5e7eb;margin:10px 0}

    .small{font-size:12px;color:#6b7280}
    .k-meta{color:#6b7280;font-size:13px}
  </style>
</head>

<body>
  <main class="main">
    <div class="c-wrap">
      <div class="top">
        <div>
          <h1 class="title">Панель касира</h1>
          <div class="muted">ПК/монітор. Список сеансів зліва, схема каси (hall-cash) справа.</div>
        </div>
        <div class="muted" id="statusLine">—</div>
      </div>

      <div class="grid">
        <!-- LEFT -->
        <section class="panel left">
          <div class="field">
            <label>Пошук події</label>
            <input id="q" placeholder="частина назви / дата / час" />
          </div>

          <div class="field">
            <label>Або відкриття вручну (show id)</label>
            <input id="manualShow" placeholder="visim / mawgli / ..." />
          </div>

          <div class="btnrow">
            <button class="btn2 primary" id="btnOpenManual">Відкрити</button>
            <button class="btn2 gray" id="btnOpenNewTab" disabled>Відкрити в новій вкладці</button>
            <button class="btn2 gray" id="btnReload" disabled>Перезавантажити схему</button>
          </div>

          <div class="hr"></div>

          <div class="k-meta">Події беруться з <b>/data/afisha.json</b>.</div>
          <div class="list" id="list"></div>

          <div class="small" style="margin-top:10px">
            Примітка: панель не лізе в Supabase — це робить <b>hall-cash</b>. Тут лише “вхід” і зручність.
          </div>
        </section>

        <!-- RIGHT -->
        <section class="panel right">
          <div class="k-meta" id="currentMeta">Оберіть сеанс.</div>
          <div class="frameWrap" style="margin-top:10px">
            <div id="hint">Оберіть подію зліва або введіть show id вручну.</div>
            <iframe id="cashFrame" src="about:blank"></iframe>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script>
    (async () => {
      const listEl = document.getElementById("list");
      const qEl = document.getElementById("q");
      const manualEl = document.getElementById("manualShow");
      const statusLine = document.getElementById("statusLine");
      const metaEl = document.getElementById("currentMeta");

      const btnOpenManual = document.getElementById("btnOpenManual");
      const btnOpenNewTab = document.getElementById("btnOpenNewTab");
      const btnReload = document.getElementById("btnReload");

      const frame = document.getElementById("cashFrame");
      const hint = document.getElementById("hint");

      let AFISHA = [];
      let activeShowId = "";
      let activeShowObj = null;

      function buildCashUrl(showId, date){
        const base = "../spectacles/hall-cash.html";
        const url = new URL(base, window.location.href);
        url.searchParams.set("show", showId);
        if(date) url.searchParams.set("date", date);
        return url.toString();
      }

      function setFrameVisible(yes){
        frame.style.display = yes ? "block" : "none";
        hint.style.display = yes ? "none" : "flex";
        btnOpenNewTab.disabled = !yes;
        btnReload.disabled = !yes;
      }

      function setStatus(text){
        statusLine.textContent = text || "—";
      }

      function openShow(showId, showObj){
        if(!showId) return;

        activeShowId = showId;
        activeShowObj = showObj || null;

        const url = buildCashUrl(showId, showObj?.date);
        frame.src = url;
        setFrameVisible(true);

        const when = [showObj?.date, showObj?.time].filter(Boolean).join(" ");
        metaEl.innerHTML = showObj
          ? `<b>${showObj.title || showId}</b> • ${when}`
          : `<b>${showId}</b>`;

        setStatus("Відкрито: " + showId);
      }

      function openInNewTab(){
        if(!activeShowId) return;
        const url = buildCashUrl(activeShowId, activeShowObj?.date);
        window.open(url, "_blank");
      }

      function reloadFrame(){
        if(!activeShowId) return;
        const url = buildCashUrl(activeShowId, activeShowObj?.date);
        frame.src = url;
      }

      function normalize(s){ return String(s||"").toLowerCase().trim(); }

      function renderList(){
        const query = normalize(qEl.value);
        const items = AFISHA.filter(x => {
          if(!query) return true;
          const hay = normalize([x.id, x.title, x.date, x.time, x.theatre, x.stage].join(" "));
          return hay.includes(query);
        });

        listEl.innerHTML = items.map(x => {
          const when = [x.date, x.time].filter(Boolean).join(" • ");
          const place = [x.theatre, x.stage].filter(Boolean).join(" • ");
          const active = (x.id === activeShowId) ? "active" : "";
          return `
            <div class="item ${active}" data-id="${x.id}">
              <div style="font-weight:900">${x.title || x.id}</div>
              <div class="muted">${when || ""}</div>
              ${place ? `<div class="muted">${place}</div>` : ""}
              <div class="muted"><span style="font-weight:800">id:</span> ${x.id}</div>
            </div>
          `;
        }).join("");

        listEl.querySelectorAll(".item").forEach(el => {
          el.addEventListener("click", () => {
            const id = el.dataset.id;
            const obj = AFISHA.find(z => z.id === id) || null;
            openShow(id, obj);
            renderList();
          });
        });

        if(!items.length){
          listEl.innerHTML = `<div class="muted" style="padding:12px">Нічого не знайдено.</div>`;
        }
      }

      async function loadAfisha(){
        try{
          const res = await fetch("../data/afisha.json", { cache: "no-store" });
          AFISHA = res.ok ? await res.json() : [];
          if(!Array.isArray(AFISHA)) AFISHA = [];
          setStatus("Подій: " + AFISHA.length);
        }catch(e){
          AFISHA = [];
          setStatus("Помилка завантаження afisha.json");
          console.error(e);
        }
      }

      btnOpenManual.addEventListener("click", () => {
        const id = manualEl.value.trim();
        if(!id) return;
        openShow(id, null);
        renderList();
      });

      btnOpenNewTab.addEventListener("click", openInNewTab);
      btnReload.addEventListener("click", reloadFrame);

      qEl.addEventListener("input", renderList);
      manualEl.addEventListener("keydown", (e) => {
        if(e.key === "Enter") btnOpenManual.click();
      });

      // init
      setFrameVisible(false);
      await loadAfisha();
      renderList();
    })();
  </script>
</body>
</html>

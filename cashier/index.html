<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира</title>
  <link rel="stylesheet" href="../styles.css" />
</head>

<body>
<main class="main">
  <div class="container">
    <h1>Панель касира</h1>
    <p class="muted">Одна схема сеансу для онлайн і каси</p>

    <input id="q" placeholder="пошук..." style="width:100%;margin-bottom:10px">

    <div id="list"></div>

    <iframe id="frame"
      style="width:100%;height:80vh;border:1px solid #ddd;border-radius:12px;margin-top:12px"
      hidden>
    </iframe>
  </div>
</main>

<script>
(async () => {
  const list = document.getElementById("list");
  const q = document.getElementById("q");
  const frame = document.getElementById("frame");

  let AFISHA = [];

  try {
    const res = await fetch("../data/afisha.json", { cache: "no-store" });
    AFISHA = res.ok ? await res.json() : [];
  } catch {}

  function render() {
    const query = q.value.toLowerCase();

    list.innerHTML = AFISHA
      .filter(x =>
        [x.title, x.date, x.time, x.id].join(" ").toLowerCase().includes(query)
      )
      .map(x => `
        <div class="card" style="cursor:pointer;margin-bottom:8px"
          onclick="openSeance('${x.seance}','${x.id}')">
          <b>${x.title}</b><br>
          ${x.date} ${x.time}<br>
          <small>seance: ${x.seance}</small>
        </div>
      `).join("");
  }

  window.openSeance = (seance, showId) => {
    if (!seance) {
      alert("У події не вказано seance");
      return;
    }
    frame.hidden = false;
    frame.src =
  `../spectacles/hall-cash.html?seance=${encodeURIComponent(seance)}&show=${encodeURIComponent(showId)}`;
+
      `&show=${encodeURIComponent(showId)}` +
      `&role=cashier`;
  };

  q.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира — Афіша</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .k-wrap{max-width:980px;margin:0 auto;}
    .k-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:16px;}
    .k-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;display:grid;gap:10px;}
    .k-poster{width:100%;height:260px;object-fit:cover;border-radius:10px;background:#e5e7eb;}
    .k-meta{color:#6b7280;font-size:14px;}
    .k-btnrow{display:flex;gap:8px;flex-wrap:wrap;}
  </style>
</head>
<body>
  <main class="main">
    <section class="section">
      <div class="container k-wrap">
        <h1>Панель касира</h1>
        <p class="k-meta">Оберіть сеанс → відкриється <b>hall-cash</b> (режим каси, без LiqPay).</p>

        <div id="grid" class="k-grid"></div>
        <p id="empty" class="k-meta" style="display:none;margin-top:12px">Наразі немає запланованих подій.</p>
      </div>
    </section>
  </main>

  <script>
    (async () => {
      const grid = document.getElementById("grid");
      const emptyEl = document.getElementById("empty");

      let items = [];
      try {
        const res = await fetch("../data/afisha.json", { cache: "no-store" });
        items = res.ok ? await res.json() : [];
      } catch (e) {
        console.error(e);
        items = [];
      }

      if (!Array.isArray(items) || !items.length) {
        emptyEl.style.display = "block";
        return;
      }

      // сортируем по дате/времени
      items.sort((a,b)=>{
        const ad = `${a.date||""} ${a.time||""}`.trim();
        const bd = `${b.date||""} ${b.time||""}`.trim();
        return ad.localeCompare(bd);
      });

      function cardHTML(s){
        const id = s.id || "";
        const when = [s.date, s.time].filter(Boolean).join(" • ");
        const place = [s.theatre, s.stage].filter(Boolean).join(" • ");
        const poster = s.poster || "";

        // ВАЖНО: открываем именно hall-cash.html
        const cashierHall = `../spectacles/hall-cash.html?show=${encodeURIComponent(id)}`;
        const buyerHall   = `../spectacles/hall.html?show=${encodeURIComponent(id)}`;

        return `
          <article class="k-card">
            ${poster ? `<img class="k-poster" src="${poster}" alt="${(s.title||"")}" onerror="this.style.display='none'">` : ""}
            <div><strong>${s.title || ""}</strong></div>
            ${when ? `<div class="k-meta">${when}</div>` : ""}
            ${place ? `<div class="k-meta">${place}</div>` : ""}

            <div class="k-btnrow">
              <a class="btn" href="${cashierHall}">Відкрити (каса)</a>
              <a class="btn secondary" href="${buyerHall}">Як покупець</a>
            </div>
          </article>
        `;
      }

      grid.innerHTML = items.map(cardHTML).join("");
    })();
  </script>
</body>
</html>

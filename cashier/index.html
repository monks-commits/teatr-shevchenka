<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира</title>
  <link rel="stylesheet" href="../styles.css" />

  <style>
    html, body { height: 100%; }
    body { margin:0; overflow:hidden; background:#f3f4f6; }

    .wrap{
      height:100vh;
      display:flex;
      flex-direction:column;
      padding:12px;
      gap:10px;
    }

    /* ===== TOP ===== */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title{font-size:20px;font-weight:900;margin:0}
    .muted{color:#6b7280;font-size:12px}

    /* ===== SEANCE BAR ===== */
    .seanceBar{
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:14px;
      padding:10px 12px;
      display:flex;
      align-items:center;
      gap:12px;
      flex-wrap:nowrap;
    }
    .seanceBar select{
      min-width:420px;
      border:1px solid #e5e7eb;
      border-radius:12px;
      padding:8px 10px;
      font-size:14px;
    }
    .btn{
      border:0;
      border-radius:12px;
      padding:10px 14px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.primary{background:#2563eb;color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}

    /* ===== FRAME ===== */
    .frameWrap{
      flex:1;
      background:#fff;
      border:1px solid #e5e7eb;
      border-radius:16px;
      overflow:hidden;
      position:relative;
    }
    #cashFrame{
      width:100%;
      height:100%;
      border:0;
      display:none;
    }
    #hint{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      color:#6b7280;
      text-align:center;
      padding:20px;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- HEADER -->
    <div class="top">
      <div>
        <h1 class="title">Панель касира</h1>
        <div class="muted">Вибір сеансу → схема каси</div>
      </div>
      <div class="muted" id="status">—</div>
    </div>

    <!-- SEANCE SELECT -->
    <div class="seanceBar">
      <strong>Сеанс:</strong>

      <select id="seanceSelect">
        <option value="">— оберіть сеанс —</option>
      </select>

      <button class="btn primary" id="btnOpen" disabled>
        Відкрити
      </button>

      <span class="muted" id="seanceInfo"></span>
    </div>

    <!-- FRAME -->
    <div class="frameWrap">
      <div id="hint">
        Оберіть сеанс зверху, щоб відкрити схему каси
      </div>
      <iframe id="cashFrame"></iframe>
    </div>

  </div>

  <script>
    (async function () {
      const select = document.getElementById("seanceSelect");
      const btn = document.getElementById("btnOpen");
      const info = document.getElementById("seanceInfo");
      const frame = document.getElementById("cashFrame");
      const hint = document.getElementById("hint");
      const status = document.getElementById("status");

      let shows = [];

      try {
        const res = await fetch("../data/afisha.json", { cache:"no-store" });
        shows = await res.json();
        status.textContent = "Сеансів: " + shows.length;
      } catch (e) {
        status.textContent = "Помилка afisha.json";
        console.error(e);
        return;
      }

      shows.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = `${s.title} — ${s.date} ${s.time}`;
        opt.dataset.url =
          `../spectacles/hall-cash.html?seance=${s.id}&mode=cash`;
        select.appendChild(opt);
      });

      select.addEventListener("change", () => {
        btn.disabled = !select.value;
        const o = select.selectedOptions[0];
        info.textContent = o ? o.textContent : "";
      });

      btn.addEventListener("click", () => {
        const o = select.selectedOptions[0];
        if (!o) return;

        frame.src = o.dataset.url;
        frame.style.display = "block";
        hint.style.display = "none";
        status.textContent = "Відкрито: " + o.value;
      });
    })();
  </script>
</body>
</html>

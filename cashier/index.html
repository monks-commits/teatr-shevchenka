<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Панель касира — Театр ім. Т. Г. Шевченка</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .wrap{max-width:980px;margin:24px auto;padding:0 16px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;display:grid;gap:12px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .muted{color:#6b7280;font-size:14px}
    select{min-width:360px;max-width:100%}
    .btn{cursor:pointer}
  </style>
</head>
<body>
  <div id="site-header"></div>
  <script type="module" src="../scripts/include.js"></script>

  <main class="wrap">
    <h1>Панель касира</h1>
    <p class="muted">
      Касир працює на тій самій схемі, що й онлайн-покупець (одні ціни/статуси).
      Оплата в касі проходить <b>без LiqPay</b>.
    </p>

    <section class="card">
      <div class="row">
        <label class="muted" for="show">Сеанс</label>
        <select id="show">
          <option value="">— обрати —</option>
        </select>
        <button id="open-hall" class="btn">Відкрити схему (каса)</button>
      </div>

      <div class="row">
        <a class="btn secondary" href="../toggle/" target="_blank" rel="noopener">Онлайн/офлайн + синхронізація</a>
        <a class="btn secondary" href="../scanner/" target="_blank" rel="noopener">Контролер (сканер)</a>
        <a class="btn secondary" href="../afisha.html" target="_blank" rel="noopener">Афіша (як покупець)</a>
      </div>

      <div id="hint" class="muted"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script type="module" src="./cashier.js"></script>
</body>
</html>

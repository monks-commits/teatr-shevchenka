<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Створити сеанс</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    body { font-family: system-ui, sans-serif; background:#f8fafc; padding:20px; }
    .card { max-width:480px; background:#fff; border-radius:12px; padding:20px; }
    h1 { margin-top:0; font-size:20px; }
    label { display:block; margin-top:12px; font-size:14px; }
    input { width:100%; padding:10px; font-size:15px; margin-top:4px; }
    button { margin-top:20px; padding:12px; width:100%; font-size:16px; border:0; border-radius:10px; background:#2563eb; color:#fff; cursor:pointer; }
  </style>
</head>
<body>

<div class="card">
  <h1>➕ Створити сеанс</h1>
<div style="margin:12px 0 4px 0;">
  <a
    id="editHallLink"
    href="#"
    style="font-weight:600;color:#2563eb;text-decoration:underline;opacity:.4;pointer-events:none"
  >
    ✏️ Редагувати схему залу
  </a>
</div>

  <form id="seanceForm">
    <label>
      Спектакль (slug)
      <input type="text" id="showSlug" required placeholder="maugli" />
    </label>

    <label>
      Дата
      <input type="date" id="date" required />
    </label>

    <label>
      Час
      <input type="time" id="time" required />
    </label>

    <button type="submit">Створити сеанс</button>
  </form>
</div>

<script src="seance-create.js"></script>
  <script>
  const showInput = document.getElementById("showSlug");
  const editLink = document.getElementById("editHallLink");

  function updateHallLink(){
    const slug = showInput.value.trim();
    if(slug){
      editLink.href = `hall-editor.html?show=${slug}`;
      editLink.style.opacity = "1";
      editLink.style.pointerEvents = "auto";
    } else {
      editLink.href = "#";
      editLink.style.opacity = ".4";
      editLink.style.pointerEvents = "none";
    }
  }

  showInput.addEventListener("input", updateHallLink);
</script>

</body>
</html>

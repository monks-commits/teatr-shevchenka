<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Події</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      padding: 24px;
    }
    h1 {
      margin-bottom: 16px;
    }
    .event {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Події</h1>

<div id="events"></div>

<script>
fetch('../../data/seances.json')
  .then(r => r.json())
  .then(seances => {
    const wrap = document.getElementById('events');

    seances
      .filter(s => s.active)
      .forEach(s => {
        const div = document.createElement('div');
        div.className = 'event';

        div.innerHTML = `
          <div>
            <strong>${s.title}</strong><br>
            ${s.date} • ${s.time}
          </div>
          <button>В касу</button>
        `;

        div.querySelector('button').onclick = () => {
          location.href = `../../spectacles/hall-cash.html?show=${s.show}&seance=${s.id}`;
        };

        wrap.appendChild(div);
      });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Події — список</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f3f4f6;
    }

    h1 {
      margin-bottom: 20px;
    }

    .event {
      background: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-id {
      font-weight: 600;
      font-size: 14px;
    }

    .event-meta {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .error {
      color: #b91c1c;
      font-weight: 600;
    }
  </style>
</head>
<body>

<h1>Події (діагностика)</h1>

<div id="out">Завантаження…</div>

<script>
(async () => {
  const out = document.getElementById('out');

  try {
    const r = await fetch('/teatr-shevchenka/data/seances/index.json');
    if (!r.ok) throw new Error('index.json not found');

    const ids = await r.json();

    if (!Array.isArray(ids) || !ids.length) {
      out.innerHTML = '<div class="error">index.json порожній</div>';
      return;
    }

    out.innerHTML = '';

    ids.forEach(id => {
      const div = document.createElement('div');
      div.className = 'event';

      // парсим дату и время из ID
      let date = '—';
      let time = '—';

      const p = id.split('-');
      if (p.length >= 6) {
        date = `${p[1]}-${p[2]}-${p[3]}`;
        time = `${p[4]}:${p[5]}`;
      }

      div.innerHTML = `
        <div>
          <div class="event-id">${id}</div>
          <div class="event-meta">${date} ${time}</div>
        </div>
        <button>В касу</button>
      `;

      div.querySelector('button').onclick = () => {
        location.href =
          '/teatr-shevchenka/spectacles/hall-cash.html'
          + '?show=koncert'
          + '&seance=' + encodeURIComponent(id);
      };

      out.appendChild(div);
    });

  } catch (e) {
    out.innerHTML = '<div class="error">Помилка завантаження index.json</div>';
    console.error(e);
  }
})();
</script>

</body>
</html>

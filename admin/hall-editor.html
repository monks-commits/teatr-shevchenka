<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Редактор залу — сеанс</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    body { background:#f8fafc; }
    .row-label {
      cursor: pointer;
      border-radius: 6px;
    }
    .row-label.active {
      background:#2563eb;
      color:#fff;
      font-weight:700;
    }
    .editor-bar {
      display:flex;
      gap:12px;
      align-items:center;
      margin:12px 0;
    }
    .editor-bar input {
      padding:10px;
      border-radius:10px;
      border:1px solid #d1d5db;
      width:140px;
    }
    .btn {
      padding:10px 14px;
      border-radius:10px;
      border:0;
      cursor:pointer;
      font-weight:700;
    }
    .btn-save { background:#22c55e; color:#022c22; }
    .btn-clear { background:#e5e7eb; }
    .hint { font-size:12px; color:#6b7280; margin-top:6px; }
  </style>
</head>

<body>
<main class="main">
  <div class="container">
    <h1>Схема залу — редагування</h1>
    <p id="meta" class="hint">—</p>

    <div class="editor-bar">
      <input id="priceInput" type="number" placeholder="Ціна ряду">
      <button class="btn btn-save" id="btnApply">Застосувати</button>
      <button class="btn btn-clear" id="btnSave">Зберегти в афішу</button>
    </div>

    <div class="hall-scroll">
      <div class="hall-inner">
        <div id="parter-block"></div>
      </div>
    </div>

    <p class="hint">
      ▶ Клік по номеру ряду — вибір<br>
      ▶ Введи ціну → «Застосувати»<br>
      ▶ «Зберегти» — запис у afisha.json
    </p>
  </div>
</main>

<script>
/* ================================
   CONFIG
================================ */
const AFISHA_URL = "../data/afisha.json";

/* ================================
   STATE
================================ */
const qs = new URLSearchParams(location.search);
const showId = qs.get("show");
const selectedRows = new Set();
let afisha = [];
let show = null;

/* ================================
   LOAD AFISHA
================================ */
async function loadAfisha(){
  const res = await fetch(AFISHA_URL, { cache:"no-store" });
  afisha = await res.json();
  show = afisha.find(x => x.id === showId);
  if(!show){
    alert("Сеанс не знайдено");
    return;
  }
  document.getElementById("meta").textContent =
    `${show.title} • ${show.date} ${show.time}`;
}

/* ================================
   RENDER HALL (simplified)
================================ */
function renderParter(){
  const block = document.getElementById("parter-block");
  block.innerHTML = "";
  for(let row=1; row<=18; row++){
    const line = document.createElement("div");
    line.className = "row-line";

    const label = document.createElement("div");
    label.className = "row-label";
    label.textContent = row;

    if(show.scene?.prices?.[`P${row}`]){
      label.classList.add("active");
    }

    label.onclick = ()=>{
      if(selectedRows.has(row)){
        selectedRows.delete(row);
        label.classList.remove("active");
      } else {
        selectedRows.add(row);
        label.classList.add("active");
      }
    };

    line.appendChild(label);
    block.appendChild(line);
  }
}

/* ================================
   APPLY PRICE
================================ */
document.getElementById("btnApply").onclick = ()=>{
  const price = Number(document.getElementById("priceInput").value);
  if(!price || !selectedRows.size){
    alert("Оберіть ряди та введіть ціну");
    return;
  }
  show.scene = show.scene || { prices:{} };
  for(const r of selectedRows){
    show.scene.prices[`P${r}`] = price;
  }
  selectedRows.clear();
  renderParter();
};

/* ================================
   SAVE
================================ */
document.getElementById("btnSave").onclick = ()=>{
  show.status = "published";
  const blob = new Blob(
    [JSON.stringify(afisha, null, 2)],
    { type:"application/json" }
  );
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "afisha.json";
  a.click();
};

/* ================================
   BOOT
================================ */
(async ()=>{
  await loadAfisha();
  renderParter();
})();
</script>
</body>
</html>

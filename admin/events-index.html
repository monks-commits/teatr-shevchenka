<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Події</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#f3f4f6;
}
header{
  background:#111827;
  color:#fff;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800;
}
a.back{
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:6px 12px;
  border-radius:999px;
  font-size:14px;
}
main{
  max-width:1100px;
  margin:40px auto;
  padding:0 20px;
}
.event{
  background:#fff;
  border-radius:14px;
  padding:18px 20px;
  margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.left{
  font-weight:700;
}
.status{
  font-size:12px;
  padding:4px 10px;
  border-radius:999px;
  margin-top:6px;
  display:inline-block;
}
.active{background:#dcfce7;color:#166534;}
.cancelled{background:#fee2e2;color:#991b1b;}
.sold{background:#e0e7ff;color:#1e3a8a;}
.btn{
  padding:6px 12px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:700;
  margin-left:6px;
}
.cash{background:#2563eb;color:#fff;}
.delete{background:#f87171;color:#fff;}
.cancel{background:#fbbf24;}
.done{background:#10b981;color:#fff;}
</style>
</head>

<body>

<header>
  Події
  <a href="../index.html" class="back">Назад</a>
</header>

<main>
  <div id="list">Завантаження...</div>
</main>

<script>
const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

async function loadSeances() {
  const container = document.getElementById("list");

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/seances?select=*&order=created_at.desc`,
    {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      }
    }
  );

  const rows = await res.json();

  if (!rows.length) {
    container.innerHTML = "Сеансів немає";
    return;
  }

  container.innerHTML = "";

  rows.forEach(s => {

    const div = document.createElement("div");
    div.className = "event";

    div.innerHTML = `
      <div class="left">
        ${s.id}
        <div class="status ${s.status}">
          ${s.status}
        </div>
      </div>

      <div>
        <button class="btn cash">В касу</button>
        <button class="btn cancel">Скасувати</button>
        <button class="btn done">Продано</button>
        <button class="btn delete">Видалити</button>
      </div>
    `;

    // В касу
    div.querySelector(".cash").onclick = () => {
      location.href =
        `/teatr-shevchenka/spectacles/hall-cash.html?seance=${s.id}`;
    };

    // Скасувати
    div.querySelector(".cancel").onclick = async () => {
      await updateStatus(s.id, "cancelled");
    };

    // Продано
    div.querySelector(".done").onclick = async () => {
      await updateStatus(s.id, "sold");
    };

    // Видалити
    div.querySelector(".delete").onclick = async () => {
      if (confirm("Видалити сеанс?")) {
        await fetch(
          `${SUPABASE_URL}/rest/v1/seances?id=eq.${s.id}`,
          {
            method: "DELETE",
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`
            }
          }
        );
        loadSeances();
      }
    };

    container.appendChild(div);
  });
}

async function updateStatus(id, status) {
  await fetch(
    `${SUPABASE_URL}/rest/v1/seances?id=eq.${id}`,
    {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ status })
    }
  );
  loadSeances();
}

loadSeances();
</script>

</body>
</html>

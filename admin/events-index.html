<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Події</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:#f3f4f6;
    }

    header{
      background:#111827;
      color:#fff;
      padding:14px 20px;
      font-weight:800;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    a.back{
      background:#2563eb;
      color:#fff;
      text-decoration:none;
      padding:6px 12px;
      border-radius:999px;
      font-size:14px;
      font-weight:700;
    }

    main{
      max-width:900px;
      margin:40px auto;
      padding:0 20px;
    }

    .event{
      background:#fff;
      border-radius:14px;
      padding:18px 20px;
      margin-bottom:16px;
      box-shadow:0 4px 14px rgba(0,0,0,.06);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .info{
      font-weight:700;
    }

    button{
      padding:8px 14px;
      border-radius:999px;
      border:none;
      background:#2563eb;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  Події
  <a href="./index.html" class="back">Назад</a>
</header>

<main>
  <div id="list">Завантаження...</div>
</main>

<script>
(async () => {
  const container = document.getElementById("list");

  try {
    const r = await fetch("../data/seances/index.json");
    const ids = await r.json();

    container.innerHTML = "";

    ids.forEach(id => {

      const div = document.createElement("div");
      div.className = "event";

      div.innerHTML = `
        <div class="info">${id}</div>
        <button>В касу</button>
      `;

      div.querySelector("button").onclick = () => {
        location.href =
          "../spectacles/hall-cash.html"
          + "?show=koncert"
          + "&seance=" + encodeURIComponent(id);
      };

      container.appendChild(div);
    });

  } catch(e) {
    container.innerHTML = "Помилка завантаження сеансів";
    console.error(e);
  }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Адмінка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .admin-frame {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      width: 320px;
      display: grid;
      gap: 16px;
    }
    .admin-frame h1 {
      margin: 0 0 12px;
      font-size: 20px;
      text-align: center;
    }
    .admin-frame a {
      display: block;
      text-align: center;
      padding: 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
    }
    .admin-frame a.secondary {
      background: #64748b;
    }
    .admin-frame a.disabled {
      background: #e5e7eb;
      color: #6b7280;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="admin-frame">
    <h1>Адмінка</h1>

    <a href="./events/index.html">Події</a>
    <a href="./seance-editor.html">Створення</a>
    <a href="./reports/index.html" class="secondary">Звіти</a>
  </div>

</body>
</html>

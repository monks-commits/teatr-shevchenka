<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Схема залу</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    .hall-layout{display:flex;gap:24px;align-items:flex-start;}
    .hall-left{flex:1 1 auto;min-width:0;}
    .hall-sidebar{width:320px;flex:0 0 320px;}
    .hall-card{margin-top:0;}

    .hall-scroll{
      background:#e5e7eb;border-radius:16px;padding:12px;
      overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;
    }
    .hall-inner{width:max(980px,100%);}

    .hall-section{margin-bottom:18px;}
    .hall-section-title{
      text-align:center;font-size:14px;text-transform:uppercase;
      letter-spacing:.08em;color:#6b7280;margin:4px 0 6px;
    }

    .row-line{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
    .row-label{width:22px;text-align:right;font-size:11px;color:#6b7280;flex:0 0 22px;}
    .seats-row{display:flex;gap:4px;flex-wrap:nowrap;}

    .seat{
      width:24px;height:24px;border-radius:6px;border:1px solid #d1d5db;background:#fff;
      font-size:11px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;padding:0;
    }

    .seat--selected{background:#2563eb !important;color:#fff;border-color:#2563eb;}
    .seat--taken{background:#9ca3af !important;color:#fff;cursor:not-allowed;}
    .seat--gap-right{margin-right:16px;}
    .amphi-gap{width:24px;flex:0 0 24px;}

    .parter-wrap{display:flex;justify-content:center;align-items:flex-start;gap:24px;}
    .hall-lodge{display:flex;flex-direction:column;align-items:center;gap:4px;}
    .hall-lodge-label{font-size:11px;color:#6b7280;margin-bottom:4px;}
    .hall-lodge-seats{display:flex;flex-direction:column;gap:4px;}

    .hall-summary-title{margin-top:0;margin-bottom:8px;}
    .hall-summary-meta{font-size:14px;color:#4b5563;margin:4px 0;}

    .row-price-list{
      margin-top:14px;padding:12px 14px;background:#f7f7f8;border-radius:12px;font-size:14px;
    }
    .row-price{
      display:flex;align-items:center;gap:8px;font-size:14px;color:#0f172a;
      padding:6px 0;border-bottom:1px dotted #e5e7eb;
    }
    .row-price:last-child{border-bottom:0;}
    .row-price .dots{
      flex:1 1 auto;border-bottom:1px dotted #e5e7eb;height:0;transform:translateY(-2px);
    }

    .seat--empty{visibility:hidden;pointer-events:none;border:none;background:transparent;}

    .hint{font-size:12px;color:#6b7280;margin-top:10px;line-height:1.35;}
    .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}

    @media (max-width:900px){
      .hall-layout{flex-direction:column;}
      .hall-sidebar{width:auto;flex:1 1 auto;}
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="container">
      <h1>Схема залу</h1>

      <div class="hall-layout">
        <div class="hall-left">
          <div class="hall-scroll">
            <div class="hall-inner">
              <section class="hall-section">
                <div class="hall-section-title">Партер</div>
                <div class="parter-wrap">
                  <div class="hall-lodge">
                    <div class="hall-lodge-label">Ложа А</div>
                    <div class="hall-lodge-seats" id="lodge-a-seats"></div>
                  </div>

                  <div id="parter-block"></div>

                  <div class="hall-lodge">
                    <div class="hall-lodge-label">Ложа Б</div>
                    <div class="hall-lodge-seats" id="lodge-b-seats"></div>
                  </div>
                </div>
              </section>

              <section class="hall-section">
                <div class="hall-section-title">Амфітеатр</div>
                <div class="hall-center">
                  <div id="amphi-block"></div>
                </div>
              </section>

              <section class="hall-section">
                <div class="hall-section-title">Балкон</div>
                <div class="hall-center">
                  <div id="balcony-block"></div>
                </div>
              </section>
            </div>
          </div>

          <div class="row-price-list" id="price-legend"></div>
        </div>

        <aside class="hall-sidebar">
          <div class="card hall-card">
            <h2 class="hall-summary-title" id="sidebar-title">Ваше замовлення</h2>

            <p id="summary-show" class="hall-summary-meta"></p>
            <p id="summary-places" class="hall-summary-meta">Обрані місця: немає</p>
            <p id="summary-amount" class="hall-summary-meta">Сума: 0 грн</p>

            <!-- buyer button (existing) -->
            <button id="go-order" class="button-primary" disabled>Перейти до оформлення</button>

            <!-- cashier buttons -->
            <div id="cashier-actions" style="display:none">
              <div class="btn-row">
                <button id="cash-sell" class="button-primary" disabled>Продати (каса)</button>
                <button id="cash-hold" class="btn secondary" disabled>Поставити на бронь</button>
                <button id="cash-clear" class="btn secondary">Очистити вибір</button>
              </div>
              <div class="hint">
                Режим каси: LiqPay вимкнено. Продаж записується у <code>orders</code> + <code>tickets</code>.
                Бронь записується у <code>bookings</code> (status=hold).
              </div>
            </div>

            <p class="hall-summary-meta hint" id="buyer-hint">
              Кнопка стане активною, коли ви оберете хоча б одне місце.
            </p>

            <p id="action-msg" class="hall-summary-meta" style="margin-top:10px;color:#111827;"></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="../scripts/include.js"></script>

  <script>
    const qs = new URLSearchParams(location.search);
    const showSlug  = qs.get("show")  || "";
    const role = (qs.get("role") || "buyer").toLowerCase(); // buyer | cashier

    // Supabase
    const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

    const takenSeats = new Set(); // seat_label
    const selected = new Map();   // seat_label -> {label, price}

    let SETTINGS = null;
    let HALL = null;
    let AFISHA = null;

    function supaHeaders(extra){
      return Object.assign({
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      }, extra || {});
    }

    function fmtMoney(n){
      const v = Number(n || 0);
      return (Number.isFinite(v) ? v : 0);
    }

    function zoneToPrefix(zone){
      if (zone === "parter") return "P";
      if (zone === "amphi") return "A";
      if (zone === "balcony") return "B";
      return "X";
    }

    function seatLabelFor(zone, row, seat, extra){
      // ВАЖНО: формат как ты подтвердил:
      // bookings/orders: ["P1-M1"], tickets.seat_label: "P1-M1"
      if (extra === "lodgeA") return `A0-M${seat}`;
      if (extra === "lodgeB") return `B0-M${seat}`;
      return `${zoneToPrefix(zone)}${row}-M${seat}`;
    }

    function seatHuman(seat_label){
      const m = String(seat_label).match(/^([PAB])(\d+)-M(\d+)$/i);
      if (!m) return seat_label;
      const row = Number(m[2]);
      const seat = Number(m[3]);
      if (m[1].toUpperCase() === "A" && row === 0) return `Ложа А, місце ${seat}`;
      if (m[1].toUpperCase() === "B" && row === 0) return `Ложа Б, місце ${seat}`;
      return `Ряд ${row}, місце ${seat}`;
    }

    async function loadJson(path){
      const r = await fetch(path, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + path);
      return await r.json();
    }

    async function loadAll(){
      SETTINGS = await loadJson("../data/settings.json");
      AFISHA = await loadJson("../data/afisha.json");
      HALL = await loadJson("../data/halls/shevchenko-big.json");
    }

    function getShow(){
      if (!Array.isArray(AFISHA)) return null;
      return AFISHA.find(x => x.id === showSlug) || null;
    }

    function getPriceForRow(rowInfo, zone, rowNumber){
      if (rowInfo && rowInfo.price != null) return fmtMoney(rowInfo.price);
      const g = rowInfo && rowInfo.price_group;
      if (g && SETTINGS && SETTINGS.pricing_defaults && SETTINGS.pricing_defaults[g] != null){
        return fmtMoney(SETTINGS.pricing_defaults[g]);
      }
      if (zone === "parter") return 200;
      if (zone === "amphi") return 140;
      if (zone === "balcony") return 120;
      return 200;
    }

    function setSummary(){
      const s = getShow();
      const showEl = document.getElementById("summary-show");
      if (showEl){
        showEl.textContent = s ? `Вистава: ${s.title} • ${s.date} ${s.time}` : (showSlug ? `Спектакль: ${showSlug}` : "");
      }

      const placesEl = document.getElementById("summary-places");
      const amountEl = document.getElementById("summary-amount");
      const btnBuyer = document.getElementById("go-order");

      const seats = Array.from(selected.keys());
      const sum = Array.from(selected.values()).reduce((acc,it)=>acc + fmtMoney(it.price), 0);

      placesEl.textContent = seats.length ? ("Обрані місця: " + seats.map(seatHuman).join("; ")) : "Обрані місця: немає";
      amountEl.textContent = `Сума: ${sum} ${SETTINGS?.theatre?.currency || "грн"}`;

      btnBuyer.disabled = seats.length === 0;

      // cashier buttons
      const sellBtn = document.getElementById("cash-sell");
      const holdBtn = document.getElementById("cash-hold");
      if (sellBtn) sellBtn.disabled = seats.length === 0;
      if (holdBtn) holdBtn.disabled = seats.length === 0;
    }

    function createSeatButton({zone,row,seat,price,aisleAfter,extra}){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "seat";
      btn.textContent = String(seat);

      const key = seatLabelFor(zone, row, seat, extra);

      if (takenSeats.has(key)){
        btn.classList.add("seat--taken");
        btn.disabled = true;
      }
      if (selected.has(key)) btn.classList.add("seat--selected");

      btn.title = `${seatHuman(key)} • ${price} ${SETTINGS?.theatre?.currency || "грн"}`;

      btn.addEventListener("click", () => {
        if (takenSeats.has(key)) return;

        if (selected.has(key)) selected.delete(key);
        else selected.set(key, { label: key, price: fmtMoney(price) });

        setSummary();
        rerenderAllSeats(); // подсветка
      });

      if (aisleAfter && seat === aisleAfter) btn.classList.add("seat--gap-right");
      return btn;
    }

    function rerenderAllSeats(){
      renderParter();
      renderAmphi();
      renderBalcony();
      renderLodges();
    }

    function renderParter(){
      const block = document.getElementById("parter-block");
      block.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "parter");
      for (const r of rows){
        const rowLine = document.createElement("div");
        rowLine.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        rowLine.appendChild(lab);

        const seatsRow = document.createElement("div");
        seatsRow.className = "seats-row";

        const seats = Number(r.seats || 0);
        const aisleAfter = r.aisle_after ? Number(r.aisle_after) : null;
        const price = getPriceForRow(r, "parter", Number(r.row));

        for (let s=1; s<=seats; s++){
          seatsRow.appendChild(createSeatButton({zone:"parter", row:Number(r.row), seat:s, price, aisleAfter}));
        }

        rowLine.appendChild(seatsRow);
        block.appendChild(rowLine);
      }
    }

    function renderAmphi(){
      const block = document.getElementById("amphi-block");
      block.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "amphi");
      for (const r of rows){
        const rowLine = document.createElement("div");
        rowLine.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        rowLine.appendChild(lab);

        const seatsRow = document.createElement("div");
        seatsRow.className = "seats-row";

        const left = Number(r.seats_left || 0);
        const right = Number(r.seats_right || 0);
        const price = getPriceForRow(r, "amphi", Number(r.row));

        for (let s=1; s<=left; s++){
          seatsRow.appendChild(createSeatButton({zone:"amphi", row:Number(r.row), seat:s, price}));
        }

        if (right > 0){
          const gap = document.createElement("div");
          gap.className = "amphi-gap";
          seatsRow.appendChild(gap);
          for (let s=left+1; s<=left+right; s++){
            seatsRow.appendChild(createSeatButton({zone:"amphi", row:Number(r.row), seat:s, price}));
          }
        }

        rowLine.appendChild(seatsRow);
        block.appendChild(rowLine);
      }
    }

    function renderBalcony(){
      const block = document.getElementById("balcony-block");
      block.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "balcony");
      for (const r of rows){
        const rowLine = document.createElement("div");
        rowLine.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        rowLine.appendChild(lab);

        const seatsRow = document.createElement("div");
        seatsRow.className = "seats-row";

        const seats = Number(r.seats || 0);
        const aisleAfter = r.aisle_after ? Number(r.aisle_after) : null;
        const price = getPriceForRow(r, "balcony", Number(r.row));

        // row 6 может быть left/right — но если задано seats_left/right, обработаем
        if (r.seats_left != null || r.seats_right != null){
          const left = Number(r.seats_left || 0);
          const right = Number(r.seats_right || 0);
          for (let s=1; s<=left; s++){
            seatsRow.appendChild(createSeatButton({zone:"balcony", row:Number(r.row), seat:s, price}));
          }
          if (right>0){
            const gap = document.createElement("div");
            gap.className = "amphi-gap";
            seatsRow.appendChild(gap);
            for (let s=left+1; s<=left+right; s++){
              seatsRow.appendChild(createSeatButton({zone:"balcony", row:Number(r.row), seat:s, price}));
            }
          }
        } else {
          for (let s=1; s<=seats; s++){
            seatsRow.appendChild(createSeatButton({zone:"balcony", row:Number(r.row), seat:s, price, aisleAfter}));
          }
        }

        rowLine.appendChild(seatsRow);
        block.appendChild(rowLine);
      }
    }

    function renderLodges(){
      const a = document.getElementById("lodge-a-seats");
      const b = document.getElementById("lodge-b-seats");
      a.innerHTML = "";
      b.innerHTML = "";

      const boxes = Array.isArray(HALL.boxes) ? HALL.boxes : [];
      const boxA = boxes.find(x => (x.id || "").toLowerCase() === "boxa");
      const boxB = boxes.find(x => (x.id || "").toLowerCase() === "boxb");

      const priceA = boxA ? fmtMoney(SETTINGS?.pricing_defaults?.[boxA.price_group] || 0) : 0;
      const priceB = boxB ? fmtMoney(SETTINGS?.pricing_defaults?.[boxB.price_group] || 0) : 0;

      const seatsA = boxA ? Number(boxA.seats || 0) : 0;
      const seatsB = boxB ? Number(boxB.seats || 0) : 0;

      for (let s=1; s<=seatsA; s++){
        a.appendChild(createSeatButton({zone:"parter", row:0, seat:s, price: priceA, extra:"lodgeA"}));
      }
      for (let s=1; s<=seatsB; s++){
        b.appendChild(createSeatButton({zone:"parter", row:0, seat:s, price: priceB, extra:"lodgeB"}));
      }
    }

    function renderPriceLegend(){
      const el = document.getElementById("price-legend");
      const defs = SETTINGS?.pricing_defaults || {};
      const pg = HALL?.price_groups || {};

      const rows = Object.keys(defs).map(k => ({
        key:k,
        price: fmtMoney(defs[k]),
        label: pg?.[k]?.label || k
      })).filter(x => x.price > 0).sort((a,b)=>b.price-a.price);

      el.innerHTML = rows.map(x => `
        <div class="row-price">
          <span>${x.label}</span>
          <span class="dots"></span>
          <strong>${x.price} ${SETTINGS?.theatre?.currency || "грн"}</strong>
        </div>
      `).join("") || `<div class="row-price"><span>Ціни не задано</span></div>`;
    }

    async function loadTakenSeats(){
      takenSeats.clear();
      if (!showSlug) return;

      // tickets заняты всегда
      const url = `${SUPABASE_URL}/rest/v1/tickets?select=seat_label&show_slug=eq.${encodeURIComponent(showSlug)}`;
      const r = await fetch(url, { headers: supaHeaders() });
      if (r.ok){
        const data = await r.json();
        for (const t of (data||[])){
          if (t && t.seat_label) takenSeats.add(String(t.seat_label));
        }
      }

      // bookings (hold) тоже считаем занятыми, пока не истекли
      const bUrl = `${SUPABASE_URL}/rest/v1/bookings?select=seats,expires_at,status&show_slug=eq.${encodeURIComponent(showSlug)}&status=eq.hold`;
      const br = await fetch(bUrl, { headers: supaHeaders() });
      if (br.ok){
        const data = await br.json();
        const now = Date.now();
        for (const b of (data||[])){
          const exp = b.expires_at ? Date.parse(b.expires_at) : 0;
          if (exp && exp < now) continue;
          const seats = Array.isArray(b.seats) ? b.seats : [];
          for (const s of seats) takenSeats.add(String(s));
        }
      }
    }

    function setModeUI(){
      const cashierBox = document.getElementById("cashier-actions");
      const buyerHint = document.getElementById("buyer-hint");
      const btnBuyer = document.getElementById("go-order");
      const title = document.getElementById("sidebar-title");

      if (role === "cashier"){
        title.textContent = "Каса";
        cashierBox.style.display = "block";
        buyerHint.style.display = "none";
        btnBuyer.style.display = "none";
      } else {
        title.textContent = "Ваше замовлення";
        cashierBox.style.display = "none";
        buyerHint.style.display = "block";
        btnBuyer.style.display = "inline-flex";
      }
    }

    function msg(text){
      const el = document.getElementById("action-msg");
      if (el) el.textContent = text || "";
    }

    function clearSelection(){
      selected.clear();
      setSummary();
      rerenderAllSeats();
    }

    async function cashierSell(){
      msg("");
      if (!showSlug) { msg("Немає show."); return; }

      const seats = Array.from(selected.keys());
      if (!seats.length) return;

      const sum = Array.from(selected.values()).reduce((acc,it)=>acc + fmtMoney(it.price), 0);

      const order_id = `CASH-${Date.now()}-${Math.random().toString(16).slice(2,8)}`;

      // 1) orders (paid)
      const orderPayload = [{
        order_id,
        show_slug: showSlug,
        seats,            // ["P1-M1"]
        amount: sum,
        currency: "UAH",
        status: "paid"
      }];

      const oRes = await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
        method: "POST",
        headers: supaHeaders(),
        body: JSON.stringify(orderPayload)
      });

      if (!oRes.ok){
        const t = await oRes.text().catch(()=> "");
        msg("Помилка orders: " + t);
        return;
      }

      // 2) tickets (по одному на место)
      const ticketsPayload = seats.map((seat_label) => ({
        order_id,
        show_slug: showSlug,
        seat_label: String(seat_label),
        price: fmtMoney(selected.get(seat_label)?.price || 0)
      }));

      const tRes = await fetch(`${SUPABASE_URL}/rest/v1/tickets`, {
        method: "POST",
        headers: supaHeaders(),
        body: JSON.stringify(ticketsPayload)
      });

      if (!tRes.ok){
        const t = await tRes.text().catch(()=> "");
        msg("Помилка tickets: " + t);
        return;
      }

      // обновим занятые и UI
      await loadTakenSeats();
      clearSelection();
      msg(`Продано (каса). order_id: ${order_id}`);
    }

    async function cashierHold(){
      msg("");
      if (!showSlug) { msg("Немає show."); return; }

      const seats = Array.from(selected.keys());
      if (!seats.length) return;

      const sum = Array.from(selected.values()).reduce((acc,it)=>acc + fmtMoney(it.price), 0);
      const order_id = `HOLD-${Date.now()}-${Math.random().toString(16).slice(2,8)}`;

      const payload = [{
        order_id,
        show_slug: showSlug,
        seats,     // ["P1-M1"]
        amount: sum,
        status: "hold"
        // expires_at default в SQL +15 минут
      }];

      const r = await fetch(`${SUPABASE_URL}/rest/v1/bookings`, {
        method: "POST",
        headers: supaHeaders(),
        body: JSON.stringify(payload)
      });

      if (!r.ok){
        const t = await r.text().catch(()=> "");
        msg("Помилка bookings: " + t);
        return;
      }

      await loadTakenSeats();
      clearSelection();
      msg(`Поставлено на бронь. order_id: ${order_id}`);
    }

    function bindButtons(){
      // buyer flow (как было)
      const go = document.getElementById("go-order");
      go.addEventListener("click", () => {
        if (role === "cashier") return; // на всякий случай
        const seats = Array.from(selected.keys());
        const sum = Array.from(selected.values()).reduce((s,it)=>s + fmtMoney(it.price), 0);
        const title = (getShow()?.title) || "";
        const url = `../checkout.html?show=${encodeURIComponent(showSlug)}&title=${encodeURIComponent(title)}&seats=${encodeURIComponent(seats.join(","))}&amount=${encodeURIComponent(sum)}`;
        location.href = url;
      });

      // cashier flow
      document.getElementById("cash-sell").addEventListener("click", cashierSell);
      document.getElementById("cash-hold").addEventListener("click", cashierHold);
      document.getElementById("cash-clear").addEventListener("click", clearSelection);
    }

    (async () => {
      setModeUI();
      bindButtons();

      await loadAll();
      renderPriceLegend();

      if (!showSlug){
        msg("Немає параметра ?show=...");
        setSummary();
        return;
      }

      await loadTakenSeats();
      rerenderAllSeats();
      setSummary();
    })();
  </script>
</body>
</html>

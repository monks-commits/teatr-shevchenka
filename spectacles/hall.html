<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Схема залу</title>

  <!-- мы находимся в /spectacles/, поднимаемся на уровень выше -->
  <link rel="stylesheet" href="../styles.css" />

  <style>
    .hall-layout{display:flex;gap:24px;align-items:flex-start;}
    .hall-left{flex:1 1 auto;min-width:0;}
    .hall-sidebar{width:280px;flex:0 0 280px;}
    .hall-card{margin-top:0;}

    .hall-scroll{
      background:#e5e7eb;border-radius:16px;padding:12px;
      overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;
    }
    .hall-inner{width:max(980px,100%);}

    .hall-section{margin-bottom:18px;}
    .hall-section-title{
      text-align:center;font-size:14px;text-transform:uppercase;
      letter-spacing:.08em;color:#6b7280;margin:4px 0 6px;
    }

    .row-line{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
    .row-label{width:22px;text-align:right;font-size:11px;color:#6b7280;flex:0 0 22px;}
    .seats-row{display:flex;gap:4px;flex-wrap:nowrap;}

    .seat{
      width:24px;height:24px;border-radius:6px;border:1px solid #d1d5db;background:#fff;
      font-size:11px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;padding:0;
    }

    .seat--selected{background:#2563eb !important;color:#fff;border-color:#2563eb;}
    .seat--taken{background:#9ca3af !important;color:#fff;cursor:not-allowed;}

    .seat--gap-right{margin-right:16px;}
    .amphi-gap{width:24px;flex:0 0 24px;}

    .parter-wrap{display:flex;justify-content:center;align-items:flex-start;gap:24px;}
    .hall-lodge{display:flex;flex-direction:column;align-items:center;gap:4px;}
    .hall-lodge-label{font-size:11px;color:#6b7280;margin-bottom:4px;}
    .hall-lodge-seats{display:flex;flex-direction:column;gap:4px;}

    .hall-summary-title{margin-top:0;margin-bottom:8px;}
    .hall-summary-meta{font-size:14px;color:#4b5563;margin:4px 0;}

    .row-price-list{
      margin-top:14px;padding:12px 14px;background:#f7f7f8;border-radius:12px;font-size:14px;
    }
    .row-price{
      display:flex;align-items:center;gap:8px;font-size:14px;color:#0f172a;
      padding:6px 0;border-bottom:1px dotted #e5e7eb;
    }
    .row-price:last-child{border-bottom:0;}
    .row-price .dots{
      flex:1 1 auto;border-bottom:1px dotted #e5e7eb;height:0;transform:translateY(-2px);
    }

    .seat--empty{visibility:hidden;pointer-events:none;border:none;background:transparent;}

    @media (max-width:900px){
      .hall-layout{flex-direction:column;}
      .hall-sidebar{width:auto;}
    }
  </style>
</head>

<body>
  <div id="site-header"></div>

  <main class="main">
    <div class="container">
      <h1>Схема залу</h1>

      <div class="hall-layout">
        <!-- Левая часть: схема -->
        <div class="hall-left">
          <div class="hall-scroll">
            <div class="hall-inner">

              <!-- Партер + ложі -->
              <section class="hall-section">
                <div class="hall-section-title">Партер</div>
                <div class="parter-wrap">
                  <div class="hall-lodge">
                    <div class="hall-lodge-label">Ложа А</div>
                    <div class="hall-lodge-seats" id="lodge-a-seats"></div>
                  </div>

                  <div id="parter-block"></div>

                  <div class="hall-lodge">
                    <div class="hall-lodge-label">Ложа Б</div>
                    <div class="hall-lodge-seats" id="lodge-b-seats"></div>
                  </div>
                </div>
              </section>

              <!-- Амфітеатр -->
              <section class="hall-section">
                <div class="hall-section-title">Амфітеатр</div>
                <div class="hall-center">
                  <div id="amphi-block"></div>
                </div>
              </section>

              <!-- Балкон -->
              <section class="hall-section">
                <div class="hall-section-title">Балкон</div>
                <div class="hall-center">
                  <div id="balcony-block"></div>
                </div>
              </section>

            </div>
          </div>

          <!-- Легенда цін (динамически) -->
          <div class="row-price-list" id="price-legend"></div>
        </div>

        <!-- Правая часть: заказ -->
        <aside class="hall-sidebar">
          <div class="card hall-card">
            <h2 class="hall-summary-title">Ваше замовлення</h2>
            <p id="summary-show" class="hall-summary-meta"></p>
            <p id="summary-places" class="hall-summary-meta">Обрані місця: немає</p>
            <p id="summary-amount" class="hall-summary-meta">Сума: 0 грн</p>
            <button id="go-order" class="button-primary" disabled>Перейти до оформлення</button>
            <p class="hall-summary-meta" style="font-size:12px;margin-top:10px;">
              Кнопка стане активною, коли ви оберете хоча б одне місце.
            </p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="../scripts/include.js"></script>

  <script>
    // ===== URL params =====
    const qs = new URLSearchParams(location.search);
    const showSlug  = qs.get("show")  || "";
    const showTitleFromUrl = qs.get("title") || "";

    // ===== Supabase (sold seats) =====
    const SUPABASE_URL = "https://fhusjlkneckbvnrdhbil.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nCCfptJOb8Lzy1uAwGBJzA_OJtDneTS";

    // ===== State =====
    const takenSeats = new Set(); // seat_label
    const selected = new Map();   // seat_label -> {label, price}

    let SETTINGS = null;
    let HALL = null;
    let AFISHA = null;

    // ===== Helpers =====
    function supaHeaders(){
      return {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
      };
    }

    function fmtMoney(n){
      const v = Number(n || 0);
      return (Number.isFinite(v) ? v : 0);
    }

    function zoneToPrefix(zone){
      // seat_label формат (как уже ожидает checkout.html):
      // P{row}-M{seat} партер
      // A{row}-M{seat} амфи
      // B{row}-M{seat} балкон
      if (zone === "parter") return "P";
      if (zone === "amphi") return "A";
      if (zone === "balcony") return "B";
      return "X";
    }

    function seatLabelFor(zone, row, seat, extra){
      // extra: для лож (A0 / B0)
      if (extra === "lodgeA") return `A0-M${seat}`;
      if (extra === "lodgeB") return `B0-M${seat}`;
      return `${zoneToPrefix(zone)}${row}-M${seat}`;
    }

    function seatHuman(seat_label){
      const m = String(seat_label).match(/^([PAB])(\d+)-M(\d+)$/i);
      if (!m) return seat_label;
      const row = Number(m[2]);
      const seat = Number(m[3]);
      if (m[1].toUpperCase() === "A" && row === 0) return `Ложа А, місце ${seat}`;
      if (m[1].toUpperCase() === "B" && row === 0) return `Ложа Б, місце ${seat}`;
      return `Ряд ${row}, місце ${seat}`;
    }

    function getPriceForRow(rowInfo, zone, rowNumber){
      // 1) rowInfo.price
      if (rowInfo && rowInfo.price != null) return fmtMoney(rowInfo.price);

      // 2) price_group -> settings.pricing_defaults
      const g = rowInfo && rowInfo.price_group;
      if (g && SETTINGS && SETTINGS.pricing_defaults && SETTINGS.pricing_defaults[g] != null){
        return fmtMoney(SETTINGS.pricing_defaults[g]);
      }

      // 3) fallback (не должен понадобиться, но пусть не будет 0)
      if (zone === "parter") return 200;
      if (zone === "amphi") return 140;
      if (zone === "balcony") return 120;
      return 200;
    }

    function setSummary(){
      const placesEl = document.getElementById("summary-places");
      const amountEl = document.getElementById("summary-amount");
      const btn = document.getElementById("go-order");

      const seats = Array.from(selected.keys());
      const sum = Array.from(selected.values()).reduce((s,it)=>s + fmtMoney(it.price), 0);

      placesEl.textContent = seats.length ? ("Обрані місця: " + seats.map(seatHuman).join("; ")) : "Обрані місця: немає";
      amountEl.textContent = `Сума: ${sum} ${SETTINGS?.theatre?.currency || "грн"}`;

      btn.disabled = seats.length === 0;
    }

    function createSeatButton({zone,row,seat,price,aisleAfter,extra}){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "seat";
      btn.textContent = String(seat);

      const key = seatLabelFor(zone,row,seat,extra);
      if (takenSeats.has(key)){
        btn.classList.add("seat--taken");
        btn.disabled = true;
      }

      if (aisleAfter && seat === aisleAfter){
        btn.classList.add("seat--gap-right");
      }

      btn.addEventListener("click", ()=>{
        if (takenSeats.has(key)) return;

        if (selected.has(key)){
          selected.delete(key);
          btn.classList.remove("seat--selected");
        }else{
          selected.set(key, { label: seatHuman(key), price });
          btn.classList.add("seat--selected");
        }
        setSummary();
      });

      return btn;
    }

    // ===== Loaders =====
    async function loadSettings(){
      const res = await fetch("../data/settings.json", {cache:"no-store"});
      SETTINGS = res.ok ? await res.json() : {};
      return SETTINGS;
    }

    async function loadHall(){
      const res = await fetch("../data/halls/shevchenko-big.json", {cache:"no-store"});
      if(!res.ok) throw new Error("Cannot load hall schema");
      HALL = await res.json();
      return HALL;
    }

    async function loadAfisha(){
      const res = await fetch("../data/afisha.json", {cache:"no-store"});
      AFISHA = res.ok ? await res.json() : [];
      return AFISHA;
    }

    async function loadTakenSeats(){
      if (!showSlug) return;

      const url =
        `${SUPABASE_URL}/rest/v1/tickets` +
        `?show_slug=eq.${encodeURIComponent(showSlug)}` +
        `&select=seat_label`;

      const res = await fetch(url, { headers: supaHeaders() });
      if(!res.ok) return;

      const rows = await res.json().catch(()=>[]);
      rows.forEach(r=>{
        if (r && r.seat_label) takenSeats.add(String(r.seat_label));
      });
    }

    // ===== Render =====
    function renderLegend(){
      const el = document.getElementById("price-legend");
      el.innerHTML = "";

      if (!HALL || !SETTINGS || !SETTINGS.pricing_defaults){
        el.innerHTML = `<div class="meta">Немає даних для легенди цін.</div>`;
        return;
      }

      // порядок по price_groups в схеме
      const pg = HALL.price_groups || {};
      const pd = SETTINGS.pricing_defaults || {};

      Object.keys(pg).forEach(key=>{
        const label = pg[key]?.label || key;
        const price = (pd[key] != null) ? fmtMoney(pd[key]) : null;
        if (price == null) return;

        const row = document.createElement("div");
        row.className = "row-price";
        row.innerHTML = `<span>${label}</span><span class="dots"></span><b>${price} ${SETTINGS?.theatre?.currency || "грн"}</b>`;
        el.appendChild(row);
      });
    }

    function renderParter(){
      const container = document.getElementById("parter-block");
      container.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "parter");
      rows.forEach(r=>{
        const line = document.createElement("div");
        line.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        line.appendChild(lab);

        const sr = document.createElement("div");
        sr.className = "seats-row";

        const seatsCount = Number(r.seats || 0);
        for(let i=1;i<=seatsCount;i++){
          const price = getPriceForRow(r, "parter", r.row);
          sr.appendChild(createSeatButton({
            zone:"parter",
            row:r.row,
            seat:i,
            price,
            aisleAfter: r.aisle_after || 0
          }));
        }

        line.appendChild(sr);
        container.appendChild(line);
      });

      // ложи
      const lodgeA = document.getElementById("lodge-a-seats");
      const lodgeB = document.getElementById("lodge-b-seats");
      lodgeA.innerHTML = "";
      lodgeB.innerHTML = "";

      const boxPrice = SETTINGS?.pricing_defaults?.p_boxes != null ? fmtMoney(SETTINGS.pricing_defaults.p_boxes) : 200;

      for(let i=1;i<=18;i++){
        lodgeA.appendChild(createSeatButton({ zone:"lodge", row:0, seat:i, price: boxPrice, extra:"lodgeA" }));
        lodgeB.appendChild(createSeatButton({ zone:"lodge", row:0, seat:i, price: boxPrice, extra:"lodgeB" }));
      }
    }

    function renderAmphi(){
      const container = document.getElementById("amphi-block");
      container.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "amphi");
      rows.forEach(r=>{
        const line = document.createElement("div");
        line.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        line.appendChild(lab);

        const sr = document.createElement("div");
        sr.className = "seats-row";

        const left = Number(r.seats_left || 0);
        const right = Number(r.seats_right || 0);

        const price = getPriceForRow(r, "amphi", r.row);

        // левый блок: M1..Mleft
        for(let i=1;i<=left;i++){
          sr.appendChild(createSeatButton({ zone:"amphi", row:r.row, seat:i, price }));
        }

        // проход
        if (right > 0){
          const gap = document.createElement("div");
          gap.className = "amphi-gap";
          sr.appendChild(gap);
        }

        // правый блок: продолжение нумерации (как в твоем комментарии A19-M12)
        for(let j=1;j<=right;j++){
          const seatNum = left + j; // M(left+1)...
          sr.appendChild(createSeatButton({ zone:"amphi", row:r.row, seat:seatNum, price }));
        }

        line.appendChild(sr);
        container.appendChild(line);
      });
    }

    function renderBalcony(){
      const container = document.getElementById("balcony-block");
      container.innerHTML = "";

      const rows = (HALL.rows || []).filter(r => r.zone === "balcony");
      rows.forEach(r=>{
        const line = document.createElement("div");
        line.className = "row-line";

        const lab = document.createElement("div");
        lab.className = "row-label";
        lab.textContent = String(r.row);
        line.appendChild(lab);

        const sr = document.createElement("div");
        sr.className = "seats-row";

        // или seats, или seats_left/seats_right
        const seats = Number(r.seats || 0);
        const left = Number(r.seats_left || 0);
        const right = Number(r.seats_right || 0);

        const price = getPriceForRow(r, "balcony", r.row);

        if (seats > 0){
          for(let i=1;i<=seats;i++){
            sr.appendChild(createSeatButton({
              zone:"balcony",
              row:r.row,
              seat:i,
              price,
              aisleAfter: r.aisle_after || 0
            }));
          }
        } else {
          for(let i=1;i<=left;i++){
            sr.appendChild(createSeatButton({ zone:"balcony", row:r.row, seat:i, price }));
          }
          if (right > 0){
            const gap = document.createElement("div");
            gap.className = "amphi-gap";
            sr.appendChild(gap);
          }
          for(let j=1;j<=right;j++){
            const seatNum = left + j;
            sr.appendChild(createSeatButton({ zone:"balcony", row:r.row, seat:seatNum, price }));
          }
        }

        line.appendChild(sr);
        container.appendChild(line);
      });
    }

    function setHeader(){
      const showEl = document.getElementById("summary-show");

      let title = showTitleFromUrl || showSlug || "Вистава";
      let dt = "";

      if (Array.isArray(AFISHA) && showSlug){
        const it = AFISHA.find(x => x && x.id === showSlug);
        if (it){
          title = it.title || title;
          dt = [it.date, it.time].filter(Boolean).join(" ");
        }
      }

      showEl.textContent = "Вистава: " + title + (dt ? (" • " + dt) : "");
    }

    // ===== Checkout redirect =====
    document.getElementById("go-order").addEventListener("click", ()=>{
      const seats = Array.from(selected.keys());
      const amount = Array.from(selected.values()).reduce((s,it)=>s + fmtMoney(it.price), 0);

      const p = new URLSearchParams();
      p.set("show", showSlug);
      p.set("title", showTitleFromUrl || "");
      p.set("seats", seats.join(","));
      p.set("amount", String(amount));

      location.href = "../checkout.html?" + p.toString();
    });

    // ===== Boot =====
    (async ()=>{
      await loadSettings();
      await loadHall();
      await loadAfisha();
      await loadTakenSeats();

      setHeader();
      renderLegend();

      renderParter();
      renderAmphi();
      renderBalcony();

      setSummary();
    })().catch(err=>{
      console.error(err);
      alert("Помилка завантаження схеми/налаштувань. Відкрийте консоль для деталей.");
    });
  </script>
</body>
</html>

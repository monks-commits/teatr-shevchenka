<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Схема залу — вечірній</title>

<link rel="stylesheet" href="../styles.css" />

<style>
/* ===== layout ===== */
.hall-layout{display:flex;gap:24px;align-items:flex-start;}
.hall-left{flex:1 1 auto;min-width:0;}
.hall-sidebar{width:280px;flex:0 0 280px;}
.hall-scroll{background:#e5e7eb;border-radius:16px;padding:12px;overflow-x:auto;}
.hall-inner{width:max(980px,100%);}
.row-line{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.row-label{width:22px;text-align:right;font-size:11px;color:#6b7280;}
.seats-row{display:flex;gap:4px;}
.seat{width:24px;height:24px;border-radius:6px;border:1px solid #d1d5db;
display:flex;align-items:center;justify-content:center;font-size:11px;
cursor:pointer;color:#111;}
.seat--selected{background:#2563eb!important;color:#fff;border-color:#2563eb;}
.seat--taken{background:#9ca3af!important;color:#fff;cursor:not-allowed;}
.seat--gap-right{margin-right:16px;}
.parter-wrap{display:flex;justify-content:center;gap:24px;}
.hall-lodge{display:flex;flex-direction:column;align-items:center;gap:4px;}
.hall-lodge-label{font-size:11px;color:#6b7280;}
.hall-lodge-seats{display:flex;flex-direction:column;gap:4px;}
.seat--empty{visibility:hidden;border:none;background:transparent}

/* ===== COLORS (театр) ===== */
.seat--price-200{background:#0ea5e9;color:#fff;}
.seat--price-180{background:#a3a300;color:#111;}
.seat--price-170{background:#155e75;color:#fff;}
.seat--price-160{background:#facc15;color:#111;}
.seat--price-140{background:#84cc16;color:#111;}
.seat--price-120{background:#38bdf8;color:#111;}
.seat--price-100{background:#c2410c;color:#fff;}
.seat--price-70 {background:#0f766e;color:#fff;}
</style>
</head>

<body>
<main class="main">
<div class="container">
<h1>Схема залу — вечірній показ</h1>

<div class="hall-layout">
<div class="hall-left">
<div class="hall-scroll">
<div class="hall-inner">

<section>
<div class="parter-wrap">

<!-- ЛОЖА А -->
<div class="hall-lodge">
<div class="hall-lodge-label">Ложа А</div>
<div class="hall-lodge-seats" id="lodge-a"></div>
</div>

<!-- ПАРТЕР -->
<div id="parter"></div>

<!-- ЛОЖА Б -->
<div class="hall-lodge">
<div class="hall-lodge-label">Ложа Б</div>
<div class="hall-lodge-seats" id="lodge-b"></div>
</div>

</div>
</section>

</div>
</div>
</div>

<aside class="hall-sidebar">
<div class="card">
<h2>Ваше замовлення</h2>
<p id="sum">Сума: 0 грн</p>
<button disabled>Оформити</button>
</div>
</aside>

</div>
</div>
</main>

<script>
/* ===== helper ===== */
const taken = new Set();
const selected = new Map();

function seatKey(zone,row,seat){
  if(zone==="P") return `P${row}-M${seat}`;
  if(zone==="A") return `A0-M${seat}`;
  if(zone==="B") return `B0-M${seat}`;
}

function makeSeat(zone,row,seat,price){
  const b=document.createElement("button");
  b.className=`seat seat--price-${price}`;
  b.textContent=seat;
  b.onclick=()=>{
    if(b.classList.contains("seat--selected")){
      b.classList.remove("seat--selected");
      selected.delete(seatKey(zone,row,seat));
    }else{
      b.classList.add("seat--selected");
      selected.set(seatKey(zone,row,seat),price);
    }
    updateSum();
  };
  return b;
}

function updateSum(){
  let sum=0;
  for(const v of selected.values()) sum+=v;
  document.getElementById("sum").textContent=`Сума: ${sum} грн`;
}

/* ===== ПАРТЕР ===== */
const parter=document.getElementById("parter");

for(let r=1;r<=18;r++){
  let price=70;
  if(r===1) price=170;
  else if(r<=3) price=200;
  else if(r<=6) price=180;
  else if(r<=8) price=170;
  else if(r<=10) price=160;
  else if(r<=12) price=140;
  else if(r<=14) price=120;
  else if(r<=16) price=100;

  const line=document.createElement("div");
  line.className="row-line";
  const lab=document.createElement("div");
  lab.className="row-label";
  lab.textContent=r;
  line.appendChild(lab);

  const row=document.createElement("div");
  row.className="seats-row";

  for(let s=1;s<=20;s++){
    const seat=makeSeat("P",r,s,price);
    if(s===10) seat.classList.add("seat--gap-right");
    row.appendChild(seat);
  }
  line.appendChild(row);
  parter.appendChild(line);
}

/* ===== ЛОЖИ ===== */
function renderLodge(el,zone){
  for(let i=1;i<=18;i++){
    let price=100;
    if(i<=2) price=170;
    else if(i<=4) price=200;
    else if(i<=8) price=180;
    else if(i<=12) price=140;
    else if(i<=15) price=120;
    el.appendChild(makeSeat(zone,0,i,price));
  }
}

renderLodge(document.getElementById("lodge-a"),"A");
renderLodge(document.getElementById("lodge-b"),"B");
</script>

</body>
</html>
